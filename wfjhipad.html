<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園平板車租借系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        Babel = { presets: [ ["react", { runtime: "classic" }] ] };
    </script>

    <style>
        /* 基礎設定：白底、黑字、俐落線條 */
        body { 
            font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif; 
            background-color: #ffffff; 
            color: #000000;
            overscroll-behavior: none; 
        }
        
        /* 辦公風硬線條框，取代原有的柔和陰影 */
        .office-border { 
            border: 1px solid #000000; 
        }
        .office-border-heavy { 
            border: 2px solid #000000; 
        }

        /* 簡單的淡入動畫 */
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* 錯誤震動 */
        @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); } 20%, 40%, 60%, 80% { transform: translateX(5px); } }
        .shake-error { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* 進度條 */
        @keyframes progress { 0% { width: 0%; } 100% { width: 100%; } }
        .animate-progress { animation: progress 1s ease-in-out forwards; }

        /* 捲軸改成商務灰黑風格 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f9fafb; border-left: 1px solid #e5e7eb; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border: 1px solid #000; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        /* 預約表格的 Checkbox 被勾選時的樣式：黑底白字 */
        .matrix-cell input:checked + div { 
            background-color: #000000; 
            color: #ffffff; 
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 1.2rem; border: 1px solid #000; margin: 20px;">
            SYSTEM LOADING...
        </div>
    </div>

    <script type="text/babel" data-type="module">
        if (window.location.protocol === 'file:') {
            alert("SECURITY WARNING: \n\nPlease do not open this file directly (file://). \nPlease use a local HTTP server or host it on GitHub Pages (https://).");
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, deleteDoc, doc, updateDoc, setDoc, serverTimestamp, writeBatch, getDocs, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBAhA7PnvzJYT_Lil1iX-TVIEgtd9rBVHg",
          authDomain: "wfjh-87c3c.firebaseapp.com",
          projectId: "wfjh-87c3c",
          storageBucket: "wfjh-87c3c.firebasestorage.app",
          messagingSenderId: "884700920300",
          appId: "1:884700920300:web:a21314106a0c7b1d67e8c9"
        };

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            alert("Firebase Init Failed.");
        }

        const appId = 'wfjh-tablet-system';

        const INITIAL_CARTS = [
            { id: 'A', location: '電腦教室 二', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'B', location: '教具室216', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'C', location: '教具室218', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'D', location: '教具室316', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'E', location: '教具室318', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'F', location: '教具室312', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'G', location: '教具室328', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'H', location: '307', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'I', location: '312', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'J', location: '327', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'K', location: '414', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'L', location: '418', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'M', location: '407', total: 36, enableOneTime: true, enableLongTerm: true },
            { id: 'N', location: '427', total: 36, enableOneTime: true, enableLongTerm: true },
        ];
        const PERIODS = [1, 2, 3, 4, 5, 6, 7];
        const DAYS_OF_WEEK = [1, 2, 3, 4, 5]; 
        const DAY_LABELS = ['日', '一', '二', '三', '四', '五', '六'];
        const ALL_DEVICES = Array.from({length: 36}, (_, i) => i + 1);

        const TEACHER_DEVICE_IDS = [34, 35, 36];
        const STUDENT_MAX_ID = 33;

        // --- Utility Functions ---
        const generateUUID = () => {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        };
        const getDayOfWeek = (dateStr) => new Date(dateStr).getDay();
        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1);
            let day = '' + d.getDate();
            const year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };
        const getMinDate = () => { const d = new Date(); d.setDate(d.getDate() + 7); return formatDate(d); };
        const addDays = (dateStr, days) => { const d = new Date(dateStr); d.setDate(d.getDate() + days); return formatDate(d); };
        const getCurrentWeekDays = () => {
            const curr = new Date();
            const day = curr.getDay(); 
            const diff = curr.getDate() - day + (day === 0 ? -6 : 1); 
            const monday = new Date(curr.setDate(diff));
            const days = [];
            for (let i = 0; i < 5; i++) {
                const d = new Date(monday); d.setDate(monday.getDate() + i); days.push(formatDate(d));
            }
            return days;
        };
        const formatDeviceList = (ids) => {
            if (!ids || ids.length === 0) return "未分配";
            const sorted = [...ids].sort((a,b)=>a-b);
            const ranges = [];
            let rangeStart = sorted[0]; let prev = sorted[0];
            for (let i = 1; i < sorted.length; i++) {
                if (sorted[i] === prev + 1) { prev = sorted[i]; } else {
                    ranges.push(rangeStart === prev ? `No.${rangeStart}` : `No.${rangeStart}~${prev}`);
                    rangeStart = sorted[i]; prev = sorted[i];
                }
            }
            ranges.push(rangeStart === prev ? `No.${rangeStart}` : `No.${rangeStart}~${prev}`);
            return ranges.join('、');
        };

        // --- UI Components ---
        function SignaturePad({ onEnd }) {
            const canvasRef = React.useRef(null);
            const [isDrawing, setIsDrawing] = React.useState(false);

            React.useEffect(() => {
                const resizeCanvas = () => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ratio = Math.max(window.devicePixelRatio || 1, 1);
                    const rect = canvas.getBoundingClientRect();
                    if (canvas.width !== rect.width * ratio || canvas.height !== rect.height * ratio) {
                        canvas.width = rect.width * ratio; canvas.height = rect.height * ratio;
                        const ctx = canvas.getContext("2d"); ctx.scale(ratio, ratio); ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.strokeStyle = "#000";
                    }
                };
                const timer = setTimeout(resizeCanvas, 300);
                window.addEventListener('resize', resizeCanvas);
                return () => { clearTimeout(timer); window.removeEventListener('resize', resizeCanvas); };
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                let cx, cy;
                if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } else { cx = e.clientX; cy = e.clientY; }
                return { x: cx - rect.left, y: cy - rect.top };
            };

            const start = (e) => { setIsDrawing(true); const ctx = canvasRef.current.getContext("2d"); const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); if(e.cancelable) e.preventDefault(); };
            const move = (e) => { if (!isDrawing) return; const ctx = canvasRef.current.getContext("2d"); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); if(e.cancelable) e.preventDefault(); };
            const end = (e) => { if(isDrawing) setIsDrawing(false); if(e.cancelable) e.preventDefault(); };
            const clear = () => { const canvas = canvasRef.current; const ctx = canvas.getContext("2d"); ctx.clearRect(0, 0, canvas.width, canvas.height); };

            return (
                <div className="flex flex-col h-full select-none">
                    <div className="office-border bg-gray-50 flex-grow touch-none relative w-full h-full mb-2">
                         <div className="absolute inset-0 flex items-center justify-center text-gray-300 font-bold pointer-events-none z-0 tracking-widest">SIGN HERE</div>
                        <canvas ref={canvasRef} style={{ width: '100%', height: '100%', touchAction: 'none' }} className="block z-10 relative cursor-crosshair w-full h-full" onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
                    </div>
                    <div className="flex justify-end gap-2 flex-shrink-0">
                        <button type="button" onClick={clear} className="text-black bg-white font-bold px-4 py-2 office-border hover:bg-gray-100 transition-colors text-sm">清除</button>
                        <button type="button" onClick={() => onEnd(canvasRef.current.toDataURL())} className="bg-black text-white font-bold px-4 py-2 office-border hover:bg-gray-800 transition-colors text-sm">確認簽名</button>
                    </div>
                </div>
            );
        }

        // Office Style Toast
        function Toast({ message, type, onClose }) {
            React.useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            return ( 
                <div className={`fixed bottom-4 right-4 office-border-heavy bg-white px-6 py-4 z-50 animate-slide-up flex items-center gap-3 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]`}>
                    {type === 'error' ? <span className="text-black font-bold border border-black px-2 py-1 bg-red-100">ERROR</span> : <span className="text-black font-bold border border-black px-2 py-1 bg-green-100">SUCCESS</span>}
                    <span className="font-bold text-sm tracking-wide">{message}</span>
                </div> 
            );
        }

        // Office Style Modal
        function Modal({ isOpen, title, children, onClose }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in">
                    <div className="bg-white office-border-heavy max-w-lg w-full overflow-hidden max-h-[90vh] flex flex-col shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
                        <div className="bg-gray-100 px-4 py-3 border-b-2 border-black flex justify-between items-center flex-shrink-0">
                            <h3 className="font-bold tracking-widest uppercase text-sm">{title}</h3>
                            <button onClick={onClose} className="text-black hover:bg-gray-200 px-2 py-1 border border-transparent hover:border-black transition-colors"><i data-lucide="x" className="w-4 h-4"></i></button>
                        </div>
                        <div className="p-5 overflow-y-auto flex-grow">{children}</div>
                    </div>
                </div>
            );
        }

        function FullScreenAnimation({ status, message, onClose }) {
            React.useEffect(() => {
                if (status === 'warning' && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);
                if (status !== 'loading') { const timer = setTimeout(onClose, status === 'warning' ? 6000 : (status === 'success' ? 2500 : 5000)); return () => clearTimeout(timer); }
            }, [onClose, status]);
            return (
                <div className="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center animate-fade-in p-4 office-border-[10px] border-black">
                    {status === 'loading' && ( 
                        <div className="text-center w-full max-w-md">
                            <h2 className="text-2xl font-bold tracking-widest mb-6 uppercase">Processing</h2>
                            <div className="w-full h-4 office-border overflow-hidden relative bg-gray-100">
                                <div className="h-full bg-black animate-progress absolute left-0 top-0"></div>
                            </div>
                        </div> 
                    )}
                    {status === 'success' && ( 
                        <div className="text-center">
                            <div className="mb-6"><span className="px-6 py-2 bg-black text-white font-bold text-2xl tracking-widest">SUCCESS</span></div>
                            <h2 className="text-3xl font-bold mb-2">預約已登錄</h2>
                            <p className="text-gray-500">請至「預約確認」查詢詳細資訊</p>
                        </div> 
                    )}
                    {status === 'warning' && ( 
                        <div className="text-center max-w-lg">
                            <div className="mb-6"><span className="px-6 py-2 bg-yellow-400 text-black border-2 border-black font-bold text-2xl tracking-widest">ATTENTION</span></div>
                            <h2 className="text-2xl font-bold mb-4">預約成功 (急件)</h2>
                            <div className="bg-gray-50 office-border p-6 text-left">
                                <p className="font-bold leading-relaxed text-sm">
                                    > 時間較為緊迫<br/>
                                    > 請務必 <span className="bg-black text-white px-1">當面或電話</span> 通知承辦人員<br/>
                                    > 分機：18
                                </p>
                            </div>
                        </div> 
                    )}
                    {status === 'error' && ( 
                        <div className="text-center shake-error max-w-lg">
                            <div className="mb-6"><span className="px-6 py-2 bg-red-600 text-white font-bold text-2xl tracking-widest office-border-heavy">FAILED</span></div>
                            <div className="bg-gray-100 office-border p-4 inline-block">
                                <p className="font-mono text-sm break-words">ERR_MSG: {message}</p>
                            </div>
                        </div> 
                    )}
                </div>
            );
        }

        // --- Main App ---
        function App() {
            const [user, setUser] = React.useState(null);
            const [view, setView] = React.useState('home'); 
            const [carts, setCarts] = React.useState([]);
            const [bookings, setBookings] = React.useState([]);
            const [cartStatus, setCartStatus] = React.useState({});
            const [isAdmin, setIsAdmin] = React.useState(false);
            
            const [toast, setToast] = React.useState(null); 
            const [modalConfig, setModalConfig] = React.useState(null); 
            const [animationState, setAnimationState] = React.useState(null);

            const showToast = (message, type = 'success') => setToast({ message, type });
            const closeToast = () => setToast(null);

            React.useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        showToast(`Auth Error`, "error");
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                if (!user) return;
                let unsubCarts, unsubBookings, unsubStatus;
                try {
                    const qCarts = query(collection(db, 'artifacts', appId, 'public', 'data', 'carts'));
                    unsubCarts = onSnapshot(qCarts, (snap) => {
                         const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                         list.sort((a, b) => a.id.localeCompare(b.id));
                         setCarts(list);
                    });
                    const qBookings = query(collection(db, 'artifacts', appId, 'public', 'data', 'bookings'));
                    unsubBookings = onSnapshot(qBookings, (snap) => {
                        setBookings(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                    const qStatus = query(collection(db, 'artifacts', appId, 'public', 'data', 'cart_status'));
                    unsubStatus = onSnapshot(qStatus, (snap) => {
                        const statusMap = {};
                        snap.docs.forEach(d => statusMap[d.id] = d.data());
                        setCartStatus(statusMap);
                    });
                } catch (error) {
                    showToast("DB Connection Error", "error");
                }
                return () => { if(unsubCarts) unsubCarts(); if(unsubBookings) unsubBookings(); if(unsubStatus) unsubStatus(); };
            }, [user]);

            const getAvailableDeviceIds = (cartId, dateStr, period, exclusiveUser = null) => {
                const dayOfWeek = getDayOfWeek(dateStr);
                const cart = carts.find(c => c.id === cartId);
                if (!cart) return [];
                let available = new Set(ALL_DEVICES);
                
                const maintenance = cartStatus[cartId];
                if (maintenance && maintenance.brokenIds) maintenance.brokenIds.forEach(id => available.delete(id));
                else if (maintenance && maintenance.brokenCount) for(let i=1; i<=maintenance.brokenCount; i++) available.delete(i);

                bookings.forEach(b => {
                    if (b.cartId !== cartId || b.status === 'cancelled') return;
                    let isSameDate = false;
                    if (b.type === 'long-term') {
                        if (parseInt(b.dayOfWeek) === dayOfWeek && (!b.startDate || (dateStr >= b.startDate && dateStr <= b.endDate))) isSameDate = true;
                    } else if (b.date === dateStr) isSameDate = true;

                    if (isSameDate) {
                        const isSamePeriod = parseInt(b.period) === parseInt(period);
                        const isSameUser = exclusiveUser && b.user === exclusiveUser;
                        if (isSamePeriod) {
                             if (b.deviceIds) b.deviceIds.forEach(id => available.delete(id));
                        }
                        else if (!isSameUser) {
                             if (b.deviceIds) b.deviceIds.forEach(id => available.delete(id));
                        }
                    }
                });
                return Array.from(available).sort((a,b) => a-b);
            };

            const getRealPeriodAvailability = (cartId, dateStr, period) => {
                 const cart = carts.find(c => c.id === cartId);
                 if (!cart) return 0;
                 let usedCount = 0;
                 const dayOfWeek = getDayOfWeek(dateStr);

                 bookings.forEach(b => {
                     if (b.cartId !== cartId || b.status === 'cancelled') return;
                     let isSameDate = false;
                     if (b.type === 'long-term') {
                         if (parseInt(b.dayOfWeek) === dayOfWeek && (!b.startDate || (dateStr >= b.startDate && dateStr <= b.endDate))) isSameDate = true;
                     } else if (b.date === dateStr) isSameDate = true;

                     if (isSameDate && parseInt(b.period) === parseInt(period)) {
                         usedCount += (b.deviceIds ? b.deviceIds.length : b.quantity);
                     }
                 });
                 
                 let total = 36;
                 const maintenance = cartStatus[cartId];
                 if (maintenance) {
                     if (maintenance.brokenIds) total -= maintenance.brokenIds.length;
                     else if (maintenance.brokenCount) total -= maintenance.brokenCount;
                 }
                 
                 return Math.max(0, total - usedCount);
            };

            const calculateCartUsageScore = (cartId, startDate, endDate, selectedSlots) => {
                 let score = 0;
                 bookings.forEach(b => {
                     if (b.cartId !== cartId || b.status === 'cancelled') return;
                     let overlapsDate = false;
                     if (b.type === 'long-term') {
                          if (startDate <= b.endDate && endDate >= b.startDate) overlapsDate = true;
                     } else {
                          if (b.date >= startDate && b.date <= endDate) overlapsDate = true;
                     }
                     if (overlapsDate) score += (b.quantity || 1);
                 });
                 return score;
            };

            const handleBackendAccess = () => {
                if (isAdmin) { setView('backend'); return; }
                setModalConfig({
                    type: 'password', title: 'ADMIN LOGIN', message: 'Enter admin password',
                    onConfirm: (val) => {
                        if (val === "wfjhadmin") { setIsAdmin(true); setView('backend'); showToast("Access Granted"); }
                        else { showToast("Access Denied", "error"); }
                    }
                });
            };

            const openReportModal = () => {
                setModalConfig({ type: 'custom', title: 'DAILY DISPATCH REPORT', render: ({ onClose }) => <DailyReportModal bookings={bookings} onClose={onClose} /> });
            };

            return (
                <div className="min-h-screen flex flex-col relative bg-white text-black font-sans">
                    {animationState && (
                        <FullScreenAnimation status={animationState.status} message={animationState.message} onClose={() => setAnimationState(null)} />
                    )}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={closeToast} />}
                    {modalConfig && <Modal isOpen={true} title={modalConfig.title} onClose={() => setModalConfig(null)}><ModalContent config={modalConfig} onClose={() => setModalConfig(null)} /></Modal>}
                    
                    {/* Office Style Header */}
                    <header className="bg-white border-b-2 border-black sticky top-0 z-40">
                        <div className="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
                            <button onClick={() => setView('home')} className="text-xl font-bold flex items-center gap-2 hover:bg-gray-100 px-2 py-1 transition-colors tracking-wide">
                                <i data-lucide="tablet" className="w-5 h-5"></i> TABLET.SYS v1.2
                            </button>
                            <div className="flex border border-black bg-gray-50">
                                <button onClick={() => setView('booking')} className={`px-4 py-1.5 text-sm font-bold tracking-wider transition ${view === 'booking' ? 'bg-black text-white' : 'text-black hover:bg-gray-200'}`}>BOOK</button>
                                <button onClick={() => setView('check')} className={`px-4 py-1.5 text-sm font-bold tracking-wider border-l border-black transition ${view === 'check' ? 'bg-black text-white' : 'text-black hover:bg-gray-200'}`}>VERIFY</button>
                            </div>
                        </div>
                    </header>

                    <main className="container mx-auto px-4 py-8 flex-grow">
                        {carts.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-64 border border-dashed border-gray-300 gap-4">
                                <div className="w-6 h-6 border-2 border-black border-t-transparent rounded-full animate-spin"></div>
                                <p className="font-mono text-xs tracking-widest text-gray-500">INITIALIZING DATA...</p>
                            </div>
                        ) : (
                            <>
                                {view === 'home' && <HomeView carts={carts.filter(c => c.enableOneTime)} getRealPeriodAvailability={getRealPeriodAvailability} setView={setView} />}
                                {view === 'booking' && <BookingView carts={carts.filter(c => c.enableLongTerm)} calculateCartUsageScore={calculateCartUsageScore} getAvailableDeviceIds={getAvailableDeviceIds} user={user} db={db} appId={appId} setAnimationState={setAnimationState} setModalConfig={setModalConfig} />}
                                {view === 'check' && <MyBookingsView bookings={bookings} />}
                                {view === 'backend' && <BackendView carts={carts} bookings={bookings} cartStatus={cartStatus} db={db} appId={appId} showToast={showToast} setModalConfig={setModalConfig} />}

            const finalSubmit = async (signatureData) => {

                const studentQuantity = parseInt(form.quantity); const teacherQuantity = form.needTeacherPad ? 1 : 0;

                let foundCartId = null;
                for (const cart of sortedCarts) {
                    let isCartValid = true; let curr = new Date(form.startDate); const end = new Date(form.endDate);
                    while (curr <= end) {
                        const dateStr = formatDate(curr); const dayOfWeek = curr.getDay(); const daySlots = form.selectedSlots.filter(s => s.day === dayOfWeek);
                        for (const slot of daySlots) {
                            const availIds = getAvailableDeviceIds(cart.id, dateStr, slot.period, null);

                    while(curr <= end) {

                    const batch = writeBatch(db); let fail = false;

                            const slotStudent = slotArr.filter(id => id <= STUDENT_MAX_ID); const slotTeacher = slotArr.filter(id => TEACHER_DEVICE_IDS.includes(id));

                    await batch.commit();

                            const otherSlots = other.type === 'long-term' ? [{ day: other.dayOfWeek, period: other.period }] : [{ day: getDayOfWeek(other.date), period: other.period }];

                            if (collision) { other.deviceIds.forEach(id => { if (map[id]) { map[id].status = 'busy'; map[id].label = 'BUSY'; } }); }

        // Daily Report Modal
        function DailyReportModal({ bookings, onClose }) {
            const [reportDate, setReportDate] = React.useState(formatDate(new Date()));
            const generateReport = () => {
                const targetDay = getDayOfWeek(reportDate); const list = bookings.filter(b => { if (b.status === 'cancelled') return false; if (b.type === 'long-term') { return parseInt(b.dayOfWeek) === targetDay && (!b.startDate || (reportDate >= b.startDate && reportDate <= b.endDate)); } else { return b.date === reportDate; } });
                const carts = {}; list.forEach(b => { if (!carts[b.cartId]) carts[b.cartId] = []; carts[b.cartId].push(b); });
                let text = `[DISPATCH REPORT - ${reportDate} W${targetDay}]\n`; if (Object.keys(carts).length === 0) text += "> NO_DATA\n";
                Object.keys(carts).sort().forEach(cartId => {
                    text += `\n[UNIT_${cartId}]\n`;
                    const cartBookings = carts[cartId]; const groups = {};
                    cartBookings.forEach(b => { const deviceStr = formatDeviceList(b.deviceIds); const key = `${b.user}_${b.ext}_${deviceStr}`; if (!groups[key]) groups[key] = { user: b.user, ext: b.ext, devices: deviceStr, periods: [] }; groups[key].periods.push(b.period); });
                    const sortedGroups = Object.values(groups).sort((a,b) => Math.min(...a.periods) - Math.min(...b.periods));
                    sortedGroups.forEach((g, index) => { const periods = [...new Set(g.periods)].sort((a,b)=>a-b).join(','); text += `> ${g.user} (x${g.ext}) P${periods}\n  ID: ${g.devices}\n`; });
                }); return text;
            };
            const text = generateReport();
            const copyToClipboard = () => { navigator.clipboard.writeText(text); };
            return ( <div className="flex flex-col h-full font-mono"><div className="mb-4 flex items-center gap-2"><label className="font-bold">DATE:</label><input type="date" value={reportDate} onChange={e => setReportDate(e.target.value)} className="office-border p-1" /></div><textarea readOnly className="flex-grow w-full office-border p-3 text-xs bg-gray-50 h-64 mb-4 focus:outline-none" value={text}></textarea><div className="flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 office-border font-bold bg-white hover:bg-gray-100">ESC</button><button onClick={copyToClipboard} className="px-4 py-2 office-border-heavy font-bold bg-black text-white hover:bg-gray-800">COPY_ALL</button></div></div> );
        }

        function MaintenanceGrid({ cartId, initialIds, onClose, db, appId, showToast }) {
            const [selected, setSelected] = React.useState(new Set(initialIds));
            const toggle = (id) => { const next = new Set(selected); if (next.has(id)) next.delete(id); else next.add(id); setSelected(next); };
            const save = async () => { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cart_status', cartId), { brokenIds: Array.from(selected).sort((a,b)=>a-b), updatedAt: serverTimestamp() }); showToast(`Updated`); onClose(); };
            return ( <div className="font-mono"><p className="text-xs mb-4 uppercase">> Select ID to lock</p><div className="grid grid-cols-6 gap-1 mb-6">{ALL_DEVICES.map(n => (<button key={n} onClick={() => toggle(n)} className={`h-10 text-sm font-bold transition-colors ${selected.has(n) ? 'bg-black text-white office-border-heavy' : 'bg-white text-black office-border hover:bg-gray-100'}`}>{n}</button>))}</div><div className="flex justify-end gap-2"><button onClick={onClose} className="px-4 py-2 office-border font-bold bg-white hover:bg-gray-100 text-sm">ESC</button><button onClick={save} className="px-4 py-2 office-border-heavy font-bold bg-black text-white hover:bg-gray-800 text-sm">EXEC</button></div></div> );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
