<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 圖像九宮格自動分割器</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2f; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #2a2a40; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin-top: 0; color: #4ade80; }
        p { color: #a1a1aa; line-height: 1.6; }
        .control-panel { background: #32324e; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input[type="file"] { display: block; margin-bottom: 15px; }
        button { background: #4ade80; color: #111; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #22c55e; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .grid-item { background: #111; border-radius: 8px; padding: 10px; text-align: center; }
        .grid-item img { max-width: 100%; border-radius: 4px; display: block; margin: 0 auto 10px auto; }
        .download-btn { background: #3b82f6; width: 100%; font-size: 14px; }
        .download-btn:hover { background: #2563eb; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>圖像九宮格自動分割器</h1>
    <p>針對 AI 生成的 3x3 網格圖設計。會<b>自動偵測並避開黑色格線</b>，切出完美的九宮格並移除周圍黑邊，方便後續丟進 remove.bg 去背。</p>

    <div class="control-panel">
        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp">
        <button id="downloadAllBtn" disabled>一鍵下載全部 9 張圖</button>
    </div>

    <div class="grid-container" id="outputGrid">
        </div>
</div>

<canvas id="hiddenCanvas"></canvas>

<script>
    const imageInput = document.getElementById('imageInput');
    const outputGrid = document.getElementById('outputGrid');
    const hiddenCanvas = document.getElementById('hiddenCanvas');
    const ctx = hiddenCanvas.getContext('2d', { willReadFrequently: true });
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    
    let generatedImages = [];

    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                processImage(img);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    function processImage(img) {
        hiddenCanvas.width = img.width;
        hiddenCanvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        
        const imgData = ctx.getImageData(0, 0, img.width, img.height);
        
        // 1. 動態偵測網格線位置 (處理框線不固定的問題)
        const xRanges = findGridLines(img.width, img.height, false, imgData);
        const yRanges = findGridLines(img.height, img.width, true, imgData);

        outputGrid.innerHTML = '';
        generatedImages = [];

        // 2. 裁切 9 個區塊
        for (let row = 0; row < yRanges.length; row++) {
            for (let col = 0; col < xRanges.length; col++) {
                const x1 = xRanges[col].start;
                const x2 = xRanges[col].end;
                const y1 = yRanges[row].start;
                const y2 = yRanges[row].end;

                // 3. 在每個小區塊內，找出非黑色像素的精確邊界 (完美去黑邊)
                const tightBox = getTightBox(imgData, x1, x2, y1, y2);

                // 建立新的 Canvas 來裝裁切好的圖
                const pieceCanvas = document.createElement('canvas');
                pieceCanvas.width = tightBox.w;
                pieceCanvas.height = tightBox.h;
                const pieceCtx = pieceCanvas.getContext('2d');
                
                // 將精確的範圍畫到新 canvas 上
                pieceCtx.drawImage(
                    img, 
                    tightBox.x, tightBox.y, tightBox.w, tightBox.h, 
                    0, 0, tightBox.w, tightBox.h
                );

                const dataURL = pieceCanvas.toDataURL('image/png');
                generatedImages.push({ url: dataURL, name: `sprite_${row}_${col}.png` });
                createOutputElement(dataURL, `sprite_${row}_${col}.png`);
            }
        }
        
        if (generatedImages.length > 0) {
            downloadAllBtn.disabled = false;
        }
    }

    // 核心演算法 1：找尋全圖的格線
    function findGridLines(size, crossSize, isRow, imgData) {
        const lines = [];
        // 掃描每一行/列，計算黑色像素的比例
        for (let i = 0; i < size; i++) {
            let blackCount = 0;
            for (let j = 0; j < crossSize; j++) {
                const x = isRow ? j : i;
                const y = isRow ? i : j;
                const idx = (y * imgData.width + x) * 4;
                // 定義黑色的閾值 (RGB都小於40)
                if (imgData.data[idx] < 40 && imgData.data[idx+1] < 40 && imgData.data[idx+2] < 40) {
                    blackCount++;
                }
            }
            // 如果這條線超過 50% 是黑色的，判定為網格分隔線
            if (blackCount / crossSize > 0.5) {
                lines.push(i);
            }
        }

        // 將非格線的部分結合成範圍 (找出內容區塊)
        const ranges = [];
        let contentStart = 0;
        let inContent = true;
        
        for (let i = 0; i < size; i++) {
            const isLine = lines.includes(i);
            if (isLine && inContent) {
                if (i - contentStart > 20) { // 忽略太小的雜訊區塊
                    ranges.push({start: contentStart, end: i - 1});
                }
                inContent = false;
            } else if (!isLine && !inContent) {
                contentStart = i;
                inContent = true;
            }
        }
        if (inContent && size - contentStart > 20) {
            ranges.push({start: contentStart, end: size - 1});
        }
        
        // 防呆機制：如果圖形太怪異導致找不到 3 個區塊，強制等分成 3 份
        if (ranges.length !== 3) {
            return [
                {start: 0, end: Math.floor(size/3) - 1},
                {start: Math.floor(size/3), end: Math.floor(size*2/3) - 1},
                {start: Math.floor(size*2/3), end: size - 1}
            ];
        }
        return ranges;
    }

    // 核心演算法 2：逼近法找尋非黑邊的實際內容區塊 (Tight Bounding Box)
    function getTightBox(imgData, startX, endX, startY, endY) {
        let minX = endX, maxX = startX, minY = endY, maxY = startY;
        let hasContent = false;
        
        for(let y = startY; y <= endY; y++){
            for(let x = startX; x <= endX; x++){
                const idx = (y * imgData.width + x) * 4;
                const r = imgData.data[idx];
                const g = imgData.data[idx+1];
                const b = imgData.data[idx+2];
                
                // 如果不是黑色 (RGB有任一 > 30)，就視為內容
                if (r > 30 || g > 30 || b > 30) {
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                    hasContent = true;
                }
            }
        }
        
        if (!hasContent) return {x: startX, y: startY, w: endX - startX, h: endY - startY};
        return {
            x: minX,
            y: minY,
            w: maxX - minX + 1,
            h: maxY - minY + 1
        };
    }

    // UI：建立顯示與下載按鈕
    function createOutputElement(dataURL, filename) {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'grid-item';
        
        const img = document.createElement('img');
        img.src = dataURL;
        
        const btn = document.createElement('button');
        btn.className = 'download-btn';
        btn.innerText = '單張下載';
        btn.onclick = () => downloadFile(dataURL, filename);
        
        itemDiv.appendChild(img);
        itemDiv.appendChild(btn);
        outputGrid.appendChild(itemDiv);
    }

    function downloadFile(dataURL, filename) {
        const link = document.createElement('a');
        link.href = dataURL;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // 一鍵下載全部功能 (稍微設定延遲避免被瀏覽器當作廣告彈出阻擋)
    downloadAllBtn.addEventListener('click', () => {
        generatedImages.forEach((img, index) => {
            setTimeout(() => {
                downloadFile(img.url, img.name);
            }, index * 200);
        });
    });

</script>
</body>
</html>
