        const IconUser = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>;

        const IconAlert = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>;
        const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>;

        // Victim Character Illustrations
        const VICTIM_EMOJIS = { happy: "😊", worried: "😟", sad: "😭", traumatized: "😱" };

        const VictimCharacter = ({ harm }) => {
            let emojiStr = VICTIM_EMOJIS.happy;
            if (harm >= 30 && harm < 55) emojiStr = VICTIM_EMOJIS.worried;
            else if (harm >= 55 && harm < 80) emojiStr = VICTIM_EMOJIS.sad;
            else if (harm >= 80) emojiStr = VICTIM_EMOJIS.traumatized;

            return (
                <div className="flex flex-col items-center">
                    <div className="flex items-center justify-center w-20 h-20 md:w-24 md:h-24 rounded-full border-4 border-slate-700 shadow-lg bg-slate-800 text-5xl md:text-6xl transition-all duration-500 select-none">
                        {emojiStr}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [localProfile, setLocalProfile] = useState(null); // { name, isHost }
            
            // Firebase States
            const [gameState, setGameState] = useState({ status: 'waiting', currentScenario: 0, totalHarm: 50 });
            const [players, setPlayers] = useState([]);
            const [votes, setVotes] = useState({}); // uid -> choice

            // Local UI States
            const [inputName, setInputName] = useState('');
            const [isHostCheckbox, setIsHostCheckbox] = useState(false);
            const [hostPassword, setHostPassword] = useState('');
            const [myVote, setMyVote] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            // 1. Initialize Firebase Auth
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                    } catch (error) {
                        console.error("Auth error:", error);
                        setErrorMsg("無法連接伺服器，請重新載入頁面。");
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => setUser(u));
                return () => unsubscribe();
            }, []);

            // 2. Setup Firestore Listeners
            useEffect(() => {
                if (!user || !localProfile) return;

                // Listen to Game State
                const unsubGame = onSnapshot(gameDocRef, (docSnap) => {
                    if (docSnap.exists()) {
                        setGameState(docSnap.data());
                        if (docSnap.data().status === 'playing') {
                            setMyVote(null); // Reset vote on new round start
                        }
                    } else {
                        // Init game state if not exists
                        if (localProfile.isHost) {
                            setDoc(gameDocRef, { status: 'waiting', currentScenario: 0, totalHarm: 50 }, { merge: true });
                        }
                    }
                }, (err) => console.error(err));

                // Listen to Players
                const unsubPlayers = onSnapshot(playersColRef, (snapshot) => {
                    const pList = [];
                    let meFound = false;
                    snapshot.forEach(doc => { 
                        pList.push({ id: doc.id, ...doc.data() });
                        if (doc.id === user.uid) meFound = true;
                    });
                    setPlayers(pList);

                    // 若被清除資料 (在名單找不到自己)，強制踢回首頁
                    if (!meFound) {
                        setLocalProfile(null);
                        setMyVote(null);
                        setIsHostCheckbox(false);
                        setHostPassword('');
                    }
                }, (err) => console.error(err));

                // Listen to Votes
                const unsubVotes = onSnapshot(votesColRef, (snapshot) => {
                    const vMap = {};
                    snapshot.forEach(doc => { vMap[doc.id] = doc.data().choice; });
                    setVotes(vMap);
                }, (err) => console.error(err));

                return () => { unsubGame(); unsubPlayers(); unsubVotes(); };
            }, [user, localProfile]);

            // Actions
            const handleJoin = async (e) => {
                e.preventDefault();
                if (!inputName.trim()) return setErrorMsg("請輸入暱稱");
                if (isHostCheckbox && hostPassword !== "19950110") return setErrorMsg("主持人密碼錯誤！");
                if (!user) return setErrorMsg("系統連線中，請稍候...");
                
                try {
                    await setDoc(doc(playersColRef, user.uid), {
                        name: inputName.trim(),
                        isHost: isHostCheckbox,
                        joinedAt: new Date().toISOString(),
                        cumulatedHarm: 0
                    });
                    setLocalProfile({ name: inputName.trim(), isHost: isHostCheckbox });
                    setErrorMsg('');
                } catch (err) {
                    console.error(err);
                    setErrorMsg("加入失敗：" + err.message);
                }
            };

            const startGame = async () => {
                if (!localProfile?.isHost) return;
                const votesSnap = await getDocs(votesColRef);
                const batch = writeBatch(db);
                votesSnap.forEach(d => batch.delete(d.ref));
                await batch.commit();

                await setDoc(gameDocRef, { status: 'playing', currentScenario: 0, totalHarm: 50 });
            };

            const submitVote = async (choiceId) => {
                if (gameState.status !== 'playing' || myVote !== null) return;
                setMyVote(choiceId);
                await setDoc(doc(votesColRef, user.uid), { choice: choiceId, scenario: gameState.currentScenario });
            };

            const showResults = async () => {
                if (!localProfile?.isHost) return;
                
                let netHarm = 0;
                const playerHarmUpdates = {};
                const currentOptions = SCENARIOS[gameState.currentScenario].options;

                Object.entries(votes).forEach(([playerId, choiceId]) => {
                    const option = currentOptions.find(o => o.id === choiceId);
                    if (option) {
                        netHarm += option.harm;
                        playerHarmUpdates[playerId] = option.harm;
                    }
                });
                
                const batch = writeBatch(db);
                players.forEach(player => {
                    if (playerHarmUpdates[player.id] !== undefined) {
                        const newCumulatedHarm = (player.cumulatedHarm || 0) + playerHarmUpdates[player.id];
                        batch.update(doc(playersColRef, player.id), { cumulatedHarm: newCumulatedHarm });
                    }
                });
                await batch.commit();
                
                // 計算平均傷害時，只計算非主持人的人數
                const nonHostCount = Math.max(1, players.filter(p => !p.isHost).length);
                const adjustedHarm = Math.round(netHarm / nonHostCount) * 1.5; 

                let newTotalHarm = gameState.totalHarm + adjustedHarm;
                if (newTotalHarm > 100) newTotalHarm = 100;
                if (newTotalHarm < 0) newTotalHarm = 0;

                await setDoc(gameDocRef, { 
                    status: 'result', 
                    totalHarm: newTotalHarm,
                    lastHarmChange: adjustedHarm
                }, { merge: true });
            };

            const nextRound = async () => {
                if (!localProfile?.isHost) return;
                
                if (gameState.currentScenario >= SCENARIOS.length - 1) {
                    await setDoc(gameDocRef, { status: 'ended' }, { merge: true });
                } else {
                    const votesSnap = await getDocs(votesColRef);
                    const batch = writeBatch(db);
                    votesSnap.forEach(d => batch.delete(d.ref));
                    await batch.commit();

                    await setDoc(gameDocRef, { 
                        status: 'playing', 
                        currentScenario: gameState.currentScenario + 1 
                    }, { merge: true });
                }
            };

            // 全新功能：強制清除所有資料，把全班踢回首頁
            const hardResetGame = async () => {
                if (!localProfile?.isHost) return;
                if (!window.confirm("⚠️ 警告：這將會清除所有資料，並強制將全班踢回登入首頁。確定要執行嗎？")) return;
                
                const batch = writeBatch(db);
                
                // 1. 清除所有投票
                const votesSnap = await getDocs(votesColRef);
                votesSnap.forEach(d => batch.delete(d.ref));
                
                // 2. 清除所有玩家 (這會觸發客戶端 listener 把大家踢回首頁)
                const playersSnap = await getDocs(playersColRef);
                playersSnap.forEach(d => batch.delete(d.ref));
                
                await batch.commit();
                
                // 3. 遊戲狀態回歸原點
                await setDoc(gameDocRef, { status: 'waiting', currentScenario: 0, totalHarm: 50 });
            };

            // 輔助函式與變數
            const getHarmColor = (val) => {
                if (val < 30) return 'bg-green-500';
                if (val < 70) return 'bg-yellow-500';
                return 'bg-red-500';
            };

            const getHarmStatusText = (val) => {
                if (val < 30) return '班級風氣良好，大家能互相尊重。';
                if (val < 70) return '出現危機，部分行為正在造成傷害。';
                return '嚴重網路霸凌發生！受害者受到極大創傷。';
            };

            // 統計人數時扣除主持人
            const nonHostPlayers = players.filter(p => !p.isHost);
            const nonHostVotesCount = Object.keys(votes).filter(uid => {
                const p = players.find(x => x.id === uid);
                return p && !p.isHost;
            }).length;

            // ---- UI SCREENS ----

            if (!localProfile) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 bg-[url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=2000')] bg-cover bg-center">
                        <div className="absolute inset-0 bg-slate-900/80"></div>
                        <div className="glass-panel p-8 rounded-2xl w-full max-w-md relative z-10 fade-in">
                            <div className="text-center mb-8">
                                <IconShield className="w-16 h-16 mx-auto text-blue-400 mb-4" />
                                <h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">風向大作戰</h1>
                                <p className="text-slate-300 mt-2">鍵盤背後的真相</p>
                            </div>
                            <form onSubmit={handleJoin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-medium text-slate-300 mb-2">請輸入您的暱稱</label>
                                    <input 
                                        type="text" 
                                        value={inputName}
                                        onChange={(e)=>setInputName(e.target.value)}
                                        className="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-lg focus:outline-none focus:border-blue-400 text-white placeholder-slate-500"
                                        placeholder="例如：小明、座號01"
                                        maxLength="10"
                                    />
                                </div>
                                <div className="flex items-center">
                                    <input 
                                        type="checkbox" 
                                        id="isHost"
                                        checked={isHostCheckbox}
                                        onChange={(e)=>{
                                            setIsHostCheckbox(e.target.checked);
                                            if(!e.target.checked) setHostPassword('');
                                        }}
                                        className="w-4 h-4 text-blue-500 rounded border-slate-600 bg-slate-800 focus:ring-blue-500 focus:ring-offset-slate-900"
                                    />
                                    <label htmlFor="isHost" className="ml-2 text-sm text-slate-400">我是老師/主持人</label>
                                </div>
                                {isHostCheckbox && (
                                    <div className="fade-in">
                                        <label className="block text-sm font-medium text-purple-300 mb-2">請輸入主持人密碼</label>
                                        <input 
                                            type="password" 
                                            value={hostPassword}
                                            onChange={(e)=>setHostPassword(e.target.value)}
                                            className="w-full px-4 py-3 bg-slate-800/50 border border-purple-600/50 rounded-lg focus:outline-none focus:border-purple-400 text-white placeholder-slate-500"
                                            placeholder="請輸入密碼"
                                        />
                                    </div>
                                )}
                                {errorMsg && <p className="text-red-400 text-sm">{errorMsg}</p>}
                                <button type="submit" className="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-lg font-bold shadow-lg transform transition hover:-translate-y-0.5">
                                    進入教室
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const currentScenarioData = SCENARIOS[gameState.currentScenario];
            const isHost = localProfile.isHost;

            return (
                <div className="min-h-screen flex flex-col p-4 md:p-8 relative">
                    {/* Header: Harm Meter & Victim */}
                    <div className="glass-panel rounded-xl p-4 md:p-6 mb-6 flex flex-col md:flex-row items-center justify-between gap-4 z-10">
                        <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between w-full md:w-auto gap-4">
                            <div className="flex items-center gap-3">
                                <div className="bg-slate-800 p-2 rounded-full"><IconUser /></div>
                                <div>
                                    <h2 className="font-bold text-lg">{localProfile.name} {isHost && <span className="text-xs bg-purple-600 px-2 py-1 rounded text-white ml-2">主持人</span>}</h2>
                                    <p className="text-sm text-slate-400">學生人數：{nonHostPlayers.length} 人</p>
                                </div>
                            </div>
                            
                            {/* 主持人專屬：強制重置按鈕 */}
                            {isHost && (
                                <button onClick={hardResetGame} className="flex items-center gap-1 text-sm bg-red-900/50 hover:bg-red-600 text-red-200 border border-red-700/50 py-2 px-3 rounded-lg transition shadow-sm">
                                    <IconTrash /> 清除資料(全班回首頁)
                                </button>
                            )}
                        </div>
                        
                        <div className="flex items-center gap-6 w-full md:w-auto mt-2 md:mt-0">
                            <VictimCharacter harm={gameState.totalHarm} />
                            <div className="flex-grow md:w-64">
                                <div className="flex justify-between text-sm mb-2">
                                    <span className="font-semibold text-slate-200 flex items-center gap-1"><IconAlert/> 受害者受創指數</span>
                                    <span className="font-bold">{gameState.totalHarm} / 100</span>
                                </div>
                                <div className="h-4 w-full bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                    <div className={`h-full progress-bar ${getHarmColor(gameState.totalHarm)}`} style={{ width: `${gameState.totalHarm}%` }}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <div className="flex-grow flex flex-col md:flex-row gap-6 z-10">
                        {/* Left/Main Column: Game Board */}
                        <div className="w-full md:w-2/3 flex flex-col gap-6">
                            
                            {/* State: Waiting (Lobby) */}
                            {gameState.status === 'waiting' && (
                                <div className="glass-panel rounded-2xl p-8 text-center flex-grow flex flex-col justify-center items-center fade-in relative overflow-hidden">
                                    <div className="absolute -right-4 -bottom-4 text-[12rem] opacity-5 pointer-events-none select-none">⏳</div>
                                    <IconShield className="w-20 h-20 text-slate-500 mb-6 relative z-10" />
                                    <h2 className="text-3xl font-bold mb-4 relative z-10">等待主持人開始遊戲...</h2>
                                    <p className="text-slate-400 mb-8 max-w-lg relative z-10">這是一個全班共同參與的生存遊戲。你們的每一次選擇，都會影響「受害者」的心理創傷指數。請謹慎選擇，將傷害降到最低！</p>
                                    
                                    {isHost && (
                                        <button onClick={startGame} className="py-4 px-12 text-xl bg-blue-600 hover:bg-blue-500 text-white rounded-full font-bold shadow-[0_0_20px_rgba(37,99,235,0.4)] transition transform hover:scale-105 relative z-10">
                                            開始第一關
                                        </button>
                                    )}
                                </div>
                            )}

                            {/* State: Playing (Voting Phase) */}
                            {gameState.status === 'playing' && currentScenarioData && (
                                <div className="glass-panel rounded-2xl p-6 md:p-8 flex-grow flex flex-col fade-in border-t-4 border-blue-500">
                                    <div className="mb-6">
                                        <span className="text-blue-400 font-bold tracking-wider text-sm">{currentScenarioData.title}</span>
                                        <h2 className="text-2xl md:text-3xl font-bold mt-2 leading-tight">{currentScenarioData.description}</h2>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8 flex-grow">
                                        {currentScenarioData.options.map((opt) => {
                                            const isSelected = myVote === opt.id;
                                            return (
                                                <button 
                                                    key={opt.id}
                                                    onClick={() => submitVote(opt.id)}
                                                    disabled={myVote !== null || isHost}
                                                    className={`p-4 md:p-6 rounded-xl text-left border-2 transition-all duration-300 flex flex-col justify-between
                                                        ${isHost ? 'opacity-50 cursor-not-allowed bg-slate-800 border-slate-700' : 
                                                          isSelected ? 'bg-blue-600/20 border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.3)]' : 
                                                          myVote !== null ? 'opacity-40 border-slate-800 bg-slate-800/50' : 
                                                          'border-slate-700 bg-slate-800/50 hover:border-slate-500 hover:bg-slate-800'}
                                                    `}
                                                >
                                                    <span className="text-lg font-medium">{opt.text}</span>
                                                    {isSelected && <span className="text-blue-400 text-sm mt-4 font-bold flex items-center gap-1">✓ 已選擇</span>}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <div className="flex flex-col sm:flex-row justify-between items-center bg-slate-900/50 p-4 rounded-lg">
                                        <div className="text-slate-300 mb-4 sm:mb-0">
                                            已投票人數： <span className="text-2xl font-bold text-white">{nonHostVotesCount}</span> / {nonHostPlayers.length}
                                        </div>
                                        {isHost ? (
                                            <button onClick={showResults} className="py-2 px-8 bg-green-600 hover:bg-green-500 text-white rounded-lg font-bold">
                                                停止投票並公佈結果
                                            </button>
                                        ) : (
                                            <div className="text-sm text-slate-400 animate-pulse">等待主持人公佈結果...</div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* State: Result Phase */}
                            {gameState.status === 'result' && currentScenarioData && (
                                <div className="glass-panel rounded-2xl p-6 md:p-8 flex-grow flex flex-col fade-in">
                                    <h2 className="text-2xl font-bold mb-6 text-center text-white border-b border-slate-700 pb-4">本回合結果分析</h2>
                                    
                                    <div className="mb-8 space-y-4">
                                        {currentScenarioData.options.map((opt) => {
                                            const count = Object.keys(votes).filter(uid => {
                                                const p = players.find(x => x.id === uid);
                                                return votes[uid] === opt.id && p && !p.isHost;
                                            }).length;
                                            const percentage = nonHostVotesCount === 0 ? 0 : Math.round((count / nonHostVotesCount) * 100);
                                            const barColor = opt.harm > 0 ? 'bg-red-500' : 'bg-green-500';
                                            return (
                                                <div key={opt.id} className="relative">
                                                    <div className="flex justify-between text-sm mb-1 z-10 relative px-2">
                                                        <span className="font-medium">{opt.text} <span className="text-xs text-slate-400">({opt.label})</span></span>
                                                        <span>{count} 人 ({percentage}%)</span>
                                                    </div>
                                                    <div className="h-8 w-full bg-slate-800 rounded overflow-hidden">
                                                        <div className={`h-full ${barColor} opacity-70`} style={{ width: `${percentage}%` }}></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    <div className="bg-blue-900/30 border border-blue-800/50 p-5 rounded-xl mb-6">
                                        <p className="text-blue-100 leading-relaxed text-lg">{currentScenarioData.knowledge}</p>
                                    </div>

                                    <div className={`p-4 rounded-lg text-center font-bold text-lg mb-6 ${gameState.lastHarmChange > 0 ? 'bg-red-900/50 text-red-200 border border-red-800' : 'bg-green-900/50 text-green-200 border border-green-800'}`}>
                                        全班決策影響：受創指數 {gameState.lastHarmChange > 0 ? `+${gameState.lastHarmChange}` : gameState.lastHarmChange}
                                    </div>

                                    {isHost && (
                                        <div className="text-center mt-auto">
                                            <button onClick={nextRound} className="py-3 px-10 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-full font-bold shadow-lg">
                                                {gameState.currentScenario >= SCENARIOS.length - 1 ? '查看最終評價' : '進入下一關'}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* State: Ended */}
                            {gameState.status === 'ended' && (
                                <div className="glass-panel rounded-2xl p-8 text-center flex-grow flex flex-col justify-center items-center fade-in">
                                    <VictimCharacter harm={gameState.totalHarm} />
                                    <h1 className="text-4xl font-bold my-6">遊戲結束</h1>
                                    <div className="text-2xl mb-8">
                                        最終受創指數：<span className={`font-bold text-4xl ml-2 ${gameState.totalHarm > 50 ? 'text-red-500' : 'text-green-500'}`}>{gameState.totalHarm}</span> / 100
                                    </div>
                                    <p className="text-xl text-slate-300 mb-10 max-w-2xl leading-relaxed">
                                        {getHarmStatusText(gameState.totalHarm)}<br/><br/>
                                        網路言論自由不代表可以無底線地傷害他人。在每一次按讚、留言、分享前，請多停頓一秒鐘，思考這會不會成為壓垮別人的最後一根稻草。<b>我們都可以選擇成為鍵盤背後的守護者，而不是加害者。</b>
                                    </p>

                                    {/* Player Stats Section */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl mb-10">
                                        {/* Guardians */}
                                        <div className="bg-green-900/30 border border-green-700/50 rounded-xl p-6 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 opacity-20 -mr-2 -mt-2 select-none">
                                                <div className="text-[8rem] leading-none">👼</div>
                                            </div>
                                            <h3 className="text-xl font-bold text-green-300 mb-4 flex items-center gap-2 relative z-10">
                                                <IconShield className="w-6 h-6" /> 鍵盤守護者 (傷害最低)
                                            </h3>
                                            <ul className="space-y-2 relative z-10 text-left">
                                                {nonHostPlayers.sort((a, b) => (a.cumulatedHarm || 0) - (b.cumulatedHarm || 0)).slice(0, 3).map((p, i) => (
                                                    <li key={p.id} className="flex justify-between items-center bg-green-800/40 p-2 rounded-lg">
                                                        <span>{i+1}. {p.name}</span>
                                                        <span className="font-bold text-green-300">{p.cumulatedHarm || 0}</span>
                                                    </li>
                                                ))}
                                                {nonHostPlayers.length === 0 && <li className="text-slate-400">尚無玩家數據</li>}
                                            </ul>
                                        </div>

                                        {/* Troublemakers */}
                                        <div className="bg-red-900/30 border border-red-700/50 rounded-xl p-6 relative overflow-hidden">
                                            <div className="absolute top-0 right-0 opacity-20 -mr-2 -mt-2 select-none">
                                                <div className="text-[8rem] leading-none">😈</div>
                                            </div>
                                            <h3 className="text-xl font-bold text-red-300 mb-4 flex items-center gap-2 relative z-10">
                                                <IconAlert className="w-6 h-6" /> 鍵盤酸民 (傷害最高)
                                            </h3>
                                            <ul className="space-y-2 relative z-10 text-left">
                                                {nonHostPlayers.sort((a, b) => (b.cumulatedHarm || 0) - (a.cumulatedHarm || 0)).slice(0, 3).map((p, i) => (
                                                    <li key={p.id} className="flex justify-between items-center bg-red-800/40 p-2 rounded-lg">
                                                        <span>{i+1}. {p.name}</span>
                                                        <span className="font-bold text-red-300">{p.cumulatedHarm || 0}</span>
                                                    </li>
                                                ))}
                                                {nonHostPlayers.length === 0 && <li className="text-slate-400">尚無玩家數據</li>}
                                            </ul>
                                        </div>
                                    </div>
                                    
                                    {isHost && (
                                        <button onClick={hardResetGame} className="py-3 px-8 border border-red-500 hover:bg-red-900/50 rounded-lg text-red-300 transition">
                                            結束課程 (清除資料回首頁)
                                        </button>
                                    )}
                                </div>
                            )}

                        </div>

                        {/* Right Column: Player List */}
                        <div className="w-full md:w-1/3 hidden md:flex flex-col">
                            <div className="glass-panel rounded-xl p-4 flex-grow flex flex-col h-full max-h-[80vh]">
                                <h3 className="font-bold text-lg mb-4 text-slate-300 flex items-center gap-2 border-b border-slate-700 pb-2">
                                    <IconUser /> 參與名單 ({players.length})
                                </h3>
                                <div className="overflow-y-auto pr-2 space-y-2 flex-grow">
                                    {players.map(p => (
                                        <div key={p.id} className="flex items-center justify-between bg-slate-800/50 p-3 rounded-lg border border-slate-700/50">
                                            <div className="flex items-center gap-2">
                                                <div className={`w-2 h-2 rounded-full ${gameState.status === 'playing' && votes[p.id] !== undefined ? 'bg-green-400' : 'bg-slate-500'}`}></div>
                                                <span className={p.id === user?.uid ? 'text-blue-400 font-bold' : 'text-slate-200'}>
                                                    {p.name} {p.isHost && <span className="text-xs bg-purple-600 px-1 py-0.5 rounded text-white ml-1">主持</span>}
                                                </span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                {isHost && !p.isHost && p.cumulatedHarm !== undefined && (
                                                    <span className={`text-xs font-bold px-2 py-1 rounded ${p.cumulatedHarm > 0 ? 'text-red-300 bg-red-900/30' : 'text-green-300 bg-green-900/30'}`}>
                                                        {p.cumulatedHarm > 0 ? `+${p.cumulatedHarm}` : p.cumulatedHarm}
                                                    </span>
                                                )}
                                                {gameState.status === 'playing' && votes[p.id] !== undefined && !p.isHost && (
                                                    <span className="text-xs text-green-400 bg-green-900/30 px-2 py-1 rounded">已投票</span>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    {players.length === 0 && <div className="text-slate-500 text-center mt-4">尚無人加入</div>}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
