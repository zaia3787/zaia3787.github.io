<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水豚君語音記帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            overflow: hidden; /* 防止整個頁面滾動，維持 App 體驗 */
        }

        /* 水豚 SVG 動畫相關 */
        .eye { transition: all 0.2s ease; }
        .mouth { transition: all 0.3s ease; }
        
        /* 說話時的動畫 */
        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        .capybara-idle .eye { animation: blink 4s infinite; transform-origin: center; }
        
        .capybara-listening .eye { transform: scale(1.2); fill: #1f2937; }
        .capybara-listening .mouth { d: path('M 80 110 Q 100 120 120 110'); } /* 微笑/期待 */

        .capybara-eating .mouth { d: path('M 80 110 Q 100 140 120 110 Z'); fill: #4b1a1a; } /* 張大嘴 */
        .capybara-eating .eye { transform: scaleY(0.2); } /* 瞇眼享受 */

        /* 對話框動畫 */
        .bubble-enter {
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 文字被吃掉的飛行元素 */
        .flying-text {
            position: fixed;
            background: white;
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            font-weight: bold;
            color: #4b5563;
            z-index: 1000;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.5, 0, 0.2, 1);
        }

        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 載入中動畫 */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #d97706;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-[100dvh]">

    <!-- App Container -->
    <div class="relative w-full max-w-md h-[100dvh] bg-orange-50 shadow-2xl flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="flex justify-between items-center p-4 bg-orange-100/80 backdrop-blur-sm z-10 rounded-b-2xl shadow-sm">
            <h1 class="text-xl font-bold text-orange-800 flex items-center gap-2">
                <i class="fa-solid fa-leaf text-green-600"></i> 水豚記帳
            </h1>
            <div class="flex items-center gap-3">
                <button id="btn-report" class="w-10 h-10 rounded-full bg-white text-orange-600 shadow flex items-center justify-center hover:bg-orange-50 transition">
                    <i class="fa-solid fa-chart-pie"></i>
                </button>
                <select id="currency-select" class="bg-white border-none rounded-full py-1.5 px-3 text-sm font-bold text-gray-700 shadow focus:ring-2 focus:ring-orange-300 outline-none">
                    <option value="TWD">TWD ($)</option>
                    <option value="USD">USD ($)</option>
                    <option value="JPY">JPY (¥)</option>
                    <option value="EUR">EUR (€)</option>
                </select>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col items-center justify-start pt-10 px-4 relative">
            
            <!-- Speech Bubble -->
            <div id="speech-bubble" class="absolute top-4 left-1/2 -translate-x-1/2 w-4/5 max-w-[280px] bg-white p-4 rounded-2xl shadow-md border-2 border-orange-200 opacity-0 hidden z-10">
                <p id="capybara-text" class="text-gray-700 font-medium text-center leading-relaxed">...</p>
                <!-- 氣泡尾巴 -->
                <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-t-[15px] border-t-white border-r-[10px] border-r-transparent filter drop-shadow(0 2px 2px rgba(0,0,0,0.05))"></div>
            </div>

            <!-- Capybara SVG -->
            <div id="capybara-container" class="mt-16 mb-4 relative z-0 capybara-idle">
                <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="capybara-svg">
                    <!-- 身體 -->
                    <ellipse cx="100" cy="120" rx="80" ry="70" fill="#A87B51" />
                    <!-- 耳朵 -->
                    <ellipse cx="40" cy="80" rx="15" ry="10" fill="#8B5A2B" transform="rotate(-30 40 80)" />
                    <ellipse cx="160" cy="80" rx="15" ry="10" fill="#8B5A2B" transform="rotate(30 160 80)" />
                    <!-- 鼻子區塊 -->
                    <ellipse cx="100" cy="100" rx="40" ry="30" fill="#C19A6B" />
                    <!-- 鼻子 -->
                    <ellipse cx="100" cy="85" rx="12" ry="6" fill="#4A3018" />
                    <!-- 眼睛 -->
                    <circle cx="65" cy="85" r="5" fill="#2D1A11" class="eye" id="eye-left" />
                    <circle cx="135" cy="85" r="5" fill="#2D1A11" class="eye" id="eye-right" />
                    <!-- 嘴巴 -->
                    <path d="M 80 110 Q 100 110 120 110" stroke="#4A3018" stroke-width="3" fill="none" class="mouth" id="mouth" />
                </svg>
            </div>

            <!-- Input Display Area -->
            <div id="input-card" class="w-full bg-white rounded-2xl p-4 shadow-lg border border-orange-100 min-h-[100px] flex flex-col justify-center opacity-0 transition-opacity duration-300">
                <p id="recognized-text" class="text-gray-800 text-lg font-medium text-center">請點擊下方麥克風說話...</p>
                <div id="location-text" class="text-xs text-gray-400 text-center mt-2 flex items-center justify-center gap-1 hidden">
                    <i class="fa-solid fa-location-dot"></i> <span id="loc-span">定位中...</span>
                </div>
            </div>

        </main>

        <!-- Bottom Controls -->
        <footer class="bg-white p-6 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20">
            <div class="flex justify-between items-center gap-4">
                <!-- 語音按鈕 -->
                <button id="btn-voice" class="flex-1 bg-orange-100 hover:bg-orange-200 text-orange-700 py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 transition-colors relative overflow-hidden">
                    <i class="fa-solid fa-microphone text-xl"></i> 
                    <span>語音輸入</span>
                    <div id="voice-ripple" class="absolute inset-0 bg-orange-300 opacity-20 hidden animate-pulse"></div>
                </button>
                
                <!-- 記帳按鈕 -->
                <button id="btn-save" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fa-solid fa-coins"></i> 
                    <span>開始記帳</span>
                </button>
            </div>
            
            <!-- 最新一筆帳單預覽 -->
            <div id="latest-record" class="mt-4 p-3 bg-gray-50 rounded-xl flex justify-between items-center text-sm border border-gray-100 hidden">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-orange-200 flex items-center justify-center text-orange-700">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <div>
                        <p id="lr-cat" class="font-bold text-gray-700">分類</p>
                        <p id="lr-desc" class="text-xs text-gray-500">描述</p>
                    </div>
                </div>
                <div class="text-right">
                    <p id="lr-amount" class="font-bold text-orange-600 text-base">$0</p>
                    <p id="lr-time" class="text-xs text-gray-400">時間</p>
                </div>
            </div>
        </footer>

        <!-- Loading Overlay for AI -->
        <div id="ai-loading" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
            <div class="loader mb-4"></div>
            <p class="text-orange-800 font-bold animate-pulse">水豚君正在努力算帳中...</p>
        </div>

        <!-- 報表 Modal -->
        <div id="report-modal" class="absolute inset-0 bg-white z-50 transform translate-y-full transition-transform duration-300 flex flex-col">
            <header class="flex justify-between items-center p-4 bg-orange-50 border-b border-orange-100">
                <h2 class="text-xl font-bold text-orange-800">花費報表</h2>
                <button id="btn-close-report" class="w-8 h-8 rounded-full bg-white text-gray-500 shadow flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>
            <div class="flex-1 overflow-y-auto p-4 no-scrollbar pb-20">
                
                <!-- 摘要卡片 -->
                <div class="bg-gradient-to-r from-orange-400 to-amber-500 rounded-2xl p-5 text-white shadow-lg mb-6">
                    <p class="text-orange-50 text-sm font-medium mb-1">本月總花費</p>
                    <div class="flex items-baseline gap-2">
                        <span id="report-currency-symbol" class="text-2xl font-bold">$</span>
                        <span id="report-total" class="text-4xl font-extrabold">0</span>
                    </div>
                </div>

                <!-- 圓餅圖：分類佔比 -->
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50 mb-6">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-orange-400"></i> 當月分類佔比
                    </h3>
                    <div class="relative h-48 w-full flex justify-center">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>

                <!-- 長條圖：每日花費 -->
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50 mb-6">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-blue-400"></i> 每日花費起伏
                    </h3>
                    <div class="relative h-48 w-full">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                
                <!-- 帳本列表 -->
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-green-400"></i> 詳細帳本
                    </h3>
                    <div id="ledger-list" class="space-y-3">
                        <!-- 紀錄會生成在這裡 -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // === 系統常數與設定 ===
        const apiKey = "AIzaSyCHZCGkOXQ3VA33WsZEwYp8VdVC5eYISmk"; // Gemini API Key 會由執行環境提供
        let currentText = "";
        let currentLocationStr = "";
        let isListening = false; // 新增：用來追蹤是否正在錄音
        let expenses = JSON.parse(localStorage.getItem('capybara_expenses')) || [];
        
        // 匯率符號對照
        const currencySymbols = { TWD: '$', USD: '$', JPY: '¥', EUR: '€' };
        
        // 水豚君的 10 句省錢鼓勵語錄
        const capybaraPhrases = [
            "記帳好棒！給你一片葉子 🍃",
            "省下來的錢可以買更多草吃喔！",
            "今天也要克制慾望，不要亂花錢~",
            "錢錢沒有不見，只是變成了喜歡的形狀。",
            "每一筆記錄，都是通往財富自由的階梯！",
            "加油！水豚君看好你喔 (๑•̀ㅂ•́)و✧",
            "記下來才不會忘記錢花去哪了！",
            "積少成多，聚沙成塔，慢慢存~",
            "今天有省錢嗎？沒有的話明天繼續努力！",
            "花錢之前想一想，是需要還是想要？"
        ];

        // === DOM 元素 ===
        const btnVoice = document.getElementById('btn-voice');
        const btnSave = document.getElementById('btn-save');
        const inputCard = document.getElementById('input-card');
        const recognizedTextEl = document.getElementById('recognized-text');
        const locationTextContainer = document.getElementById('location-text');
        const locSpan = document.getElementById('loc-span');
        const capybaraContainer = document.getElementById('capybara-container');
        const speechBubble = document.getElementById('speech-bubble');
        const capybaraText = document.getElementById('capybara-text');
        const voiceRipple = document.getElementById('voice-ripple');
        const aiLoading = document.getElementById('ai-loading');
        const currencySelect = document.getElementById('currency-select');
        
        // 報表相關
        const btnReport = document.getElementById('btn-report');
        const btnCloseReport = document.getElementById('btn-close-report');
        const reportModal = document.getElementById('report-modal');
        let pieChartInstance = null;
        let barChartInstance = null;

        // === 初始化 ===
        function init() {
            updateLatestRecordUI();
            
            // 語音辨識初始化 (Web Speech API)
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'zh-TW';
                recognition.interimResults = true; // 顯示即時結果
                
                const voiceIcon = btnVoice.querySelector('i');
                const voiceSpan = btnVoice.querySelector('span');
                
                recognition.onstart = () => {
                    isListening = true;
                    capybaraContainer.className = 'mt-16 mb-4 relative z-0 capybara-listening';
                    voiceRipple.classList.remove('hidden');
                    voiceRipple.classList.replace('bg-orange-300', 'bg-red-300');
                    inputCard.classList.remove('opacity-0');
                    recognizedTextEl.textContent = '聆聽中...';
                    btnSave.disabled = true;
                    hideBubble();
                    getLocation(); // 開始說話時順便抓定位
                    
                    // 將按鈕切換為「結束輸入」的紅色狀態
                    voiceIcon.className = 'fa-solid fa-stop text-xl';
                    voiceSpan.textContent = '結束輸入';
                    btnVoice.classList.replace('bg-orange-100', 'bg-red-100');
                    btnVoice.classList.replace('text-orange-700', 'text-red-700');
                    btnVoice.classList.replace('hover:bg-orange-200', 'hover:bg-red-200');
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            currentText += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    recognizedTextEl.textContent = currentText + interimTranscript;
                };

                recognition.onend = () => {
                    isListening = false;
                    capybaraContainer.className = 'mt-16 mb-4 relative z-0 capybara-idle';
                    voiceRipple.classList.add('hidden');
                    
                    // 將按鈕恢復為「語音輸入」的橘色狀態
                    voiceIcon.className = 'fa-solid fa-microphone text-xl';
                    voiceSpan.textContent = '語音輸入';
                    btnVoice.classList.replace('bg-red-100', 'bg-orange-100');
                    btnVoice.classList.replace('text-red-700', 'text-orange-700');
                    btnVoice.classList.replace('hover:bg-red-200', 'hover:bg-orange-200');
                    voiceRipple.classList.replace('bg-red-300', 'bg-orange-300');
                    
                    if (currentText.trim() !== "") {
                        btnSave.disabled = false;
                        showRandomPhrase();
                    } else {
                        recognizedTextEl.textContent = '沒有聽到聲音喔，再試一次？';
                    }
                };

                recognition.onerror = (event) => {
                    console.error("Speech recognition error", event.error);
                    recognizedTextEl.textContent = '語音辨識發生錯誤，請確認麥克風權限。';
                    
                    isListening = false;
                    capybaraContainer.className = 'mt-16 mb-4 relative z-0 capybara-idle';
                    voiceRipple.classList.add('hidden');
                    
                    // 發生錯誤時也恢復按鈕狀態
                    voiceIcon.className = 'fa-solid fa-microphone text-xl';
                    voiceSpan.textContent = '語音輸入';
                    btnVoice.classList.replace('bg-red-100', 'bg-orange-100');
                    btnVoice.classList.replace('text-red-700', 'text-orange-700');
                    btnVoice.classList.replace('hover:bg-red-200', 'hover:bg-orange-200');
                    voiceRipple.classList.replace('bg-red-300', 'bg-orange-300');
                };

                btnVoice.addEventListener('click', () => {
                    if (isListening) {
                        recognition.stop(); // 如果正在聽，點擊則手動停止並結算文字
                    } else {
                        currentText = ""; // 重置
                        recognition.start();
                    }
                });
            } else {
                btnVoice.innerHTML = '<i class="fa-solid fa-keyboard text-xl"></i> <span>無語音支援(點擊輸入)</span>';
                btnVoice.addEventListener('click', () => {
                    const text = prompt("您的瀏覽器不支援語音辨識，請手動輸入記帳內容：", "例如：剛剛在全聯買了便當和飲料150元");
                    if (text) {
                        currentText = text;
                        inputCard.classList.remove('opacity-0');
                        recognizedTextEl.textContent = currentText;
                        btnSave.disabled = false;
                        getLocation();
                        showRandomPhrase();
                    }
                });
            }

            // 按鈕事件綁定
            btnSave.addEventListener('click', handleSaveExpense);
            btnReport.addEventListener('click', openReport);
            btnCloseReport.addEventListener('click', () => {
                reportModal.classList.add('translate-y-full');
            });
            currencySelect.addEventListener('change', () => {
                updateLatestRecordUI();
                if(!reportModal.classList.contains('translate-y-full')) {
                    updateReportUI();
                }
            });
        }

        // === 抓取定位 ===
        function getLocation() {
            locationTextContainer.classList.remove('hidden');
            locSpan.textContent = "定位中...";
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        currentLocationStr = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
                        // 簡單的經緯度顯示，若要轉地址需串接 Geocoding API，這裡簡化處理
                        locSpan.textContent = "已取得目前位置";
                    },
                    (error) => {
                        console.warn("Geolocation error:", error);
                        currentLocationStr = "無法取得位置";
                        locSpan.textContent = "未開啟定位";
                    },
                    { timeout: 5000 }
                );
            } else {
                currentLocationStr = "不支援定位";
                locSpan.textContent = "不支援定位";
            }
        }

        // === 水豚君互動 ===
        function showRandomPhrase() {
            const phrase = capybaraPhrases[Math.floor(Math.random() * capybaraPhrases.length)];
            capybaraText.textContent = phrase;
            speechBubble.classList.remove('hidden');
            speechBubble.classList.remove('bubble-enter');
            // 觸發重繪以重啟動畫
            void speechBubble.offsetWidth; 
            speechBubble.classList.add('bubble-enter');
        }

        function hideBubble() {
            speechBubble.classList.add('hidden');
            speechBubble.classList.remove('bubble-enter');
        }

        // === AI 解析與儲存 ===
        async function handleSaveExpense() {
            if (!currentText.trim()) return;
            
            aiLoading.classList.remove('hidden');
            btnSave.disabled = true;
            btnVoice.disabled = true;

            try {
                // 呼叫 Gemini API 進行解析
                const expenseData = await parseExpenseWithAI(currentText, currentLocationStr);
                
                // 準備動畫
                aiLoading.classList.add('hidden');
                await playEatingAnimation();

                // 儲存資料
                expenseData.id = Date.now().toString();
                expenseData.originalText = currentText;
                expenseData.currency = currencySelect.value;
                expenses.push(expenseData);
                localStorage.setItem('capybara_expenses', JSON.stringify(expenses));

                // 更新 UI
                updateLatestRecordUI();
                
                // 重置狀態
                currentText = "";
                recognizedTextEl.textContent = "記帳完成！";
                setTimeout(() => {
                    inputCard.classList.add('opacity-0');
                    btnSave.disabled = true;
                    btnVoice.disabled = false;
                }, 1500);

            } catch (error) {
                console.error(error);
                aiLoading.classList.add('hidden');
                alert("解析失敗，請再試一次！錯誤：" + error.message);
                btnSave.disabled = false;
                btnVoice.disabled = false;
            }
        }

        async function parseExpenseWithAI(text, location) {
            const currentDateTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
            const prompt = `
請作為一個專業的記帳助理，根據以下使用者的語音內容提取記帳資訊。
當前時間：${currentDateTime}
使用者位置資訊：${location}

規則：
1. 分析文本中的時間，如果是相對時間（如「昨天晚上」、「剛剛」），請推算出正確的 ISO 格式時間 (YYYY-MM-DDTHH:mm)。如果沒提，就用當前時間。
2. 自動判斷分類 (category)。請將細項歸類為大項目。例如：早餐/晚餐/便當/手搖飲 -> "飲食"；捷運/公車/計程車 -> "交通"；看電影/唱歌 -> "娛樂"；買衣服/保養品 -> "購物"。盡量使用簡潔的兩個字或三個字作為分類。
3. 提取純數字的金額 (amount)。
4. 簡短描述買了什麼 (description)。

請務必只回傳合法的 JSON 格式字串，不要有 markdown 標記 (不要有 \`\`\`json )，格式如下：
{
  "date": "YYYY-MM-DDTHH:mm",
  "category": "分類名稱",
  "amount": 150,
  "description": "便當和飲料"
}

使用者語音內容：「${text}」`;

            // 實作 Retry 機制
            let retries = 3;
            let delay = 1000;
            
            while (retries > 0) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: {
                                responseMimeType: "application/json"
                            }
                        })
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    const textResult = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!textResult) throw new Error("無效的 API 回應");
                    
                    return JSON.parse(textResult);

                } catch (error) {
                    retries--;
                    if (retries === 0) throw error;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        // === 動畫：吃掉帳單 ===
        function playEatingAnimation() {
            return new Promise((resolve) => {
                // 隱藏對話氣泡
                hideBubble();
                
                // 改變水豚狀態為張嘴
                capybaraContainer.className = 'mt-16 mb-4 relative z-0 capybara-eating';
                
                // 取得原文字方塊與嘴巴的座標
                const inputRect = inputCard.getBoundingClientRect();
                const mouthEl = document.getElementById('mouth');
                const mouthRect = mouthEl.getBoundingClientRect();

                // 創建飛行元素
                const flyingEl = document.createElement('div');
                flyingEl.className = 'flying-text';
                flyingEl.textContent = currentText.length > 10 ? currentText.substring(0, 10) + '...' : currentText;
                
                // 設定初始位置 (與 inputCard 相同)
                flyingEl.style.left = `${inputRect.left}px`;
                flyingEl.style.top = `${inputRect.top}px`;
                flyingEl.style.width = `${inputRect.width}px`;
                document.body.appendChild(flyingEl);

                // 讓瀏覽器計算初始狀態
                requestAnimationFrame(() => {
                    // 移動到嘴巴位置並縮小
                    flyingEl.style.left = `${mouthRect.left + mouthRect.width/2 - inputRect.width/4}px`;
                    flyingEl.style.top = `${mouthRect.top}px`;
                    flyingEl.style.transform = 'scale(0.1)';
                    flyingEl.style.opacity = '0';

                    // 隱藏原本的輸入框內容
                    recognizedTextEl.textContent = "";
                    locationTextContainer.classList.add('hidden');
                });

                // 動畫結束清理
                setTimeout(() => {
                    flyingEl.remove();
                    capybaraContainer.className = 'mt-16 mb-4 relative z-0 capybara-idle';
                    
                    // 打嗝的文字
                    capybaraText.textContent = "嗝！好吃！(๑´ڡ`๑)";
                    speechBubble.classList.remove('hidden');
                    speechBubble.classList.add('bubble-enter');
                    
                    resolve();
                }, 600); // 對應 CSS transition 0.6s
            });
        }

        // === UI 更新 ===
        function updateLatestRecordUI() {
            const lrEl = document.getElementById('latest-record');
            if (expenses.length === 0) {
                lrEl.classList.add('hidden');
                return;
            }
            
            lrEl.classList.remove('hidden');
            const latest = expenses[expenses.length - 1];
            const sym = currencySymbols[currencySelect.value] || '$';
            
            document.getElementById('lr-cat').textContent = latest.category;
            document.getElementById('lr-desc').textContent = latest.description;
            document.getElementById('lr-amount').textContent = `${sym}${latest.amount}`;
            
            // 格式化時間
            const d = new Date(latest.date);
            document.getElementById('lr-time').textContent = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        // === 報表功能 ===
        function openReport() {
            reportModal.classList.remove('translate-y-full');
            updateReportUI();
        }

        function updateReportUI() {
            if (expenses.length === 0) return;

            const sym = currencySymbols[currencySelect.value] || '$';
            document.getElementById('report-currency-symbol').textContent = sym;

            // 過濾當月資料
            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}`;
            
            const monthExpenses = expenses.filter(e => e.date.startsWith(currentMonthStr));
            
            // 總和
            const total = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
            document.getElementById('report-total').textContent = total.toLocaleString();

            // 準備圓餅圖資料 (分類佔比)
            const catMap = {};
            monthExpenses.forEach(e => {
                catMap[e.category] = (catMap[e.category] || 0) + Number(e.amount);
            });
            const pieLabels = Object.keys(catMap);
            const pieData = Object.values(catMap);
            const pieColors = ['#F59E0B', '#10B981', '#3B82F6', '#EF4444', '#8B5CF6', '#EC4899'];

            // 準備長條圖資料 (每日起伏)
            const dayMap = {};
            // 初始化當月天數
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for(let i=1; i<=daysInMonth; i++) {
                dayMap[String(i).padStart(2, '0')] = 0;
            }
            monthExpenses.forEach(e => {
                const day = e.date.substring(8, 10);
                dayMap[day] += Number(e.amount);
            });
            const barLabels = Object.keys(dayMap).map(d => `${d}日`);
            const barData = Object.values(dayMap);

            // 渲染圖表
            renderPieChart(pieLabels, pieData, pieColors);
            renderBarChart(barLabels, barData);
            
            // 渲染列表
            renderLedgerList(monthExpenses.slice().reverse()); // 最新在前
        }

        function renderPieChart(labels, data, colors) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();
            
            if(data.length === 0) {
                // 沒資料時防呆
                labels = ['無資料']; data = [1]; colors = ['#E5E7EB'];
            }

            pieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { font: { family: "'Noto Sans TC', sans-serif" } } }
                    },
                    cutout: '65%'
                }
            });
        }

        function renderBarChart(labels, data) {
            const ctx = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '每日花費',
                        data: data,
                        backgroundColor: '#60A5FA',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 7 } },
                        y: { beginAtZero: true, border: { dash: [4, 4] }, grid: { color: '#F3F4F6' } }
                    }
                }
            });
        }

        function renderLedgerList(listData) {
            const container = document.getElementById('ledger-list');
            container.innerHTML = '';
            const sym = currencySymbols[currencySelect.value] || '$';

            if(listData.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-4">這個月還沒有花費喔！</p>';
                return;
            }

            listData.forEach(item => {
                const d = new Date(item.date);
                const timeStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                
                const el = document.createElement('div');
                el.className = 'flex justify-between items-center p-3 hover:bg-orange-50 rounded-xl transition-colors border-b border-gray-50 last:border-0';
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex flex-col items-center justify-center text-xs text-gray-500 font-bold">
                            <span>${d.getDate()}</span>
                        </div>
                        <div>
                            <p class="font-bold text-gray-700">${item.category}</p>
                            <p class="text-xs text-gray-400 max-w-[150px] truncate" title="${item.description}">${item.description}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-gray-800">${sym}${Number(item.amount).toLocaleString()}</p>
                        <p class="text-xs text-gray-400">${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</p>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // 啟動 App
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
