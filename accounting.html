<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水豚君語音記帳 (連續記帳版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            overflow: hidden; 
        }

        /* 水豚 SVG 動畫相關 */
        .eye { transition: all 0.2s ease; }
        .mouth { transition: all 0.3s ease; }
        
        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        
        .capybara-idle .eye { animation: blink 4s infinite; }
        .capybara-listening .eye { transform: scale(1.2); fill: #1f2937; }
        .capybara-listening .mouth { d: path('M 80 110 Q 100 120 120 110'); }
        .capybara-eating .mouth { d: path('M 80 110 Q 100 140 120 110 Z'); fill: #4b1a1a; }
        .capybara-eating .eye { transform: scaleY(0.2); }

        /* 對話框與氣泡動畫 */
        .bubble-enter {
            opacity: 0;
            transform: translate(-50%, 10px) scale(0.9);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        
        .chat-bubble-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #d97706;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-[100dvh]">

    <div class="relative w-full max-w-md h-[100dvh] bg-orange-50 shadow-2xl flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="flex justify-between items-center p-4 bg-orange-100/80 backdrop-blur-sm z-10 rounded-b-2xl shadow-sm shrink-0">
            <h1 class="text-xl font-bold text-orange-800 flex items-center gap-2">
                <i class="fa-solid fa-leaf text-green-600"></i> 水豚記帳
            </h1>
            <div class="flex items-center gap-2">
                <button id="btn-report" class="w-10 h-10 rounded-full bg-white text-orange-600 shadow flex items-center justify-center hover:bg-orange-50 transition">
                    <i class="fa-solid fa-chart-pie"></i>
                </button>
                <select id="currency-select" class="bg-white border-none rounded-full py-1.5 px-2 text-sm font-bold text-gray-700 shadow focus:ring-2 focus:ring-orange-300 outline-none">
                    <option value="TWD">TWD ($)</option>
                    <option value="USD">USD ($)</option>
                    <option value="JPY">JPY (¥)</option>
                </select>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col items-center justify-start pt-6 px-4 relative overflow-hidden">
            
            <!-- 絕對定位鐵盒 -->
            <div class="relative w-[160px] h-[160px] mt-12 mb-4 shrink-0 flex justify-center">
                
                <!-- Speech Bubble -->
                <div id="speech-bubble" class="absolute bottom-full mb-4 left-1/2 -translate-x-1/2 w-[260px] bg-white p-3 rounded-2xl shadow-md border-2 border-orange-200 opacity-0 hidden z-10 pointer-events-none">
                    <p id="capybara-text" class="text-gray-700 font-medium text-center text-sm leading-relaxed">...</p>
                    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-t-[15px] border-t-white border-r-[10px] border-r-transparent filter drop-shadow(0 2px 2px rgba(0,0,0,0.05))"></div>
                </div>

                <!-- Capybara SVG -->
                <div id="capybara-container" class="capybara-idle z-0 absolute inset-0 w-full h-full">
                    <svg width="100%" height="100%" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="capybara-svg">
                        <ellipse cx="100" cy="120" rx="80" ry="70" fill="#A87B51" />
                        <ellipse cx="40" cy="80" rx="15" ry="10" fill="#8B5A2B" transform="rotate(-30 40 80)" />
                        <ellipse cx="160" cy="80" rx="15" ry="10" fill="#8B5A2B" transform="rotate(30 160 80)" />
                        <ellipse cx="100" cy="100" rx="40" ry="30" fill="#C19A6B" />
                        <ellipse cx="100" cy="85" rx="12" ry="6" fill="#4A3018" />
                        <circle cx="65" cy="85" r="5" fill="#2D1A11" class="eye" id="eye-left" style="transform-origin: 65px 85px;" />
                        <circle cx="135" cy="85" r="5" fill="#2D1A11" class="eye" id="eye-right" style="transform-origin: 135px 85px;" />
                        <path d="M 80 110 Q 100 110 120 110" stroke="#4A3018" stroke-width="3" fill="none" class="mouth" id="mouth" />
                    </svg>
                </div>
            </div>

            <!-- LINE 風格對話紀錄區 -->
            <div id="chat-container" class="w-full flex-1 overflow-y-auto no-scrollbar flex flex-col items-end pb-4 pt-2 space-y-4">
                <div id="temp-bubble-container" class="w-full flex flex-col items-end hidden chat-bubble-enter">
                    <div class="bg-gray-200 text-gray-600 px-4 py-3 rounded-2xl rounded-tr-sm shadow-sm max-w-[85%] text-left">
                        <span id="temp-text" class="animate-pulse">聆聽中...</span>
                    </div>
                    <div class="text-[0.65rem] text-gray-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot"></i> <span id="loc-span">定位中...</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Controls -->
        <footer class="bg-white p-6 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20 shrink-0">
            <div class="flex justify-between items-center gap-4">
                <button id="btn-voice" class="flex-1 bg-orange-100 hover:bg-orange-200 text-orange-700 py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 transition-colors relative overflow-hidden">
                    <i class="fa-solid fa-microphone text-xl"></i> 
                    <span>語音輸入</span>
                    <div id="voice-ripple" class="absolute inset-0 bg-orange-300 opacity-20 hidden animate-pulse"></div>
                </button>
                
                <button id="btn-save" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fa-solid fa-coins"></i> 
                    <span>開始記帳</span>
                </button>
            </div>
            
            <div id="latest-record" class="mt-4 p-3 bg-gray-50 rounded-xl flex justify-between items-center text-sm border border-gray-100 hidden">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-orange-200 flex items-center justify-center text-orange-700">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 mb-0.5">最新紀錄</p>
                        <p id="lr-cat" class="font-bold text-gray-700 leading-tight">分類</p>
                        <p id="lr-desc" class="text-xs text-gray-500">描述</p>
                    </div>
                </div>
                <div class="text-right">
                    <p id="lr-amount" class="font-bold text-orange-600 text-base">$0</p>
                    <p id="lr-time" class="text-xs text-gray-400 mt-1">時間</p>
                </div>
            </div>
        </footer>

        <!-- Loading Overlay -->
        <div id="ai-loading" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
            <div class="loader mb-4"></div>
            <p class="text-orange-800 font-bold animate-pulse mt-2">正在處理多筆帳單中...</p>
            <p id="loading-status" class="text-xs text-gray-500 mt-1">分析語意與金額</p>
        </div>

        <!-- 📊 報表 Modal -->
        <div id="report-modal" class="absolute inset-0 bg-white z-40 transform translate-y-full transition-transform duration-300 flex flex-col">
            <header class="flex justify-between items-center p-4 bg-orange-50 border-b border-orange-100 shrink-0">
                <h2 class="text-xl font-bold text-orange-800">花費報表</h2>
                <button id="btn-close-report" class="w-8 h-8 rounded-full bg-white text-gray-500 shadow flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>
            <div class="flex-1 overflow-y-auto p-4 no-scrollbar pb-20">
                <div class="bg-gradient-to-r from-orange-400 to-amber-500 rounded-2xl p-5 text-white shadow-lg mb-6">
                    <p class="text-orange-50 text-sm font-medium mb-1">本月總花費</p>
                    <div class="flex items-baseline gap-2">
                        <span id="report-currency-symbol" class="text-2xl font-bold">$</span>
                        <span id="report-total" class="text-4xl font-extrabold">0</span>
                    </div>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50 mb-6">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-pie text-orange-400"></i> 當月分類佔比</h3>
                    <div class="relative h-48 w-full flex justify-center"><canvas id="pieChart"></canvas></div>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50 mb-6">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-line text-blue-400"></i> 每日花費起伏</h3>
                    <div class="relative h-48 w-full"><canvas id="barChart"></canvas></div>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-list-ul text-green-400"></i> 詳細帳本</h3>
                    <div id="ledger-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Debug Log -->
    <div id="debug-log" class="fixed top-0 left-0 w-full p-4 bg-orange-900 text-white text-xs z-[9999] hidden max-h-48 overflow-auto break-all shadow-lg rounded-b-xl">
        <div class="flex justify-between font-bold mb-2">
            <span>ℹ️ 系統紀錄</span>
            <button onclick="document.getElementById('debug-log').classList.add('hidden')"><i class="fa-solid fa-xmark"></i> 關閉</button>
        </div>
        <p id="debug-text"></p>
    </div>

    <script>
        let pendingRecords = []; 
        let currentTempText = "";
        let currentLocationStr = "";
        let isListening = false;
        let expenses = JSON.parse(localStorage.getItem('capybara_expenses')) || [];
        
        const currencySymbols = { TWD: '$', USD: '$', JPY: '¥', EUR: '€' };
        const capybaraPhrases = [
            "收到！還有其他花費嗎？",
            "水豚幫你記好啦！",
            "錢錢沒有不見~",
            "交給我吧 (๑•̀ㅂ•́)و✧"
        ];

        // DOM Elements
        const btnVoice = document.getElementById('btn-voice');
        const btnSave = document.getElementById('btn-save');
        const chatContainer = document.getElementById('chat-container');
        const tempBubbleContainer = document.getElementById('temp-bubble-container');
        const tempTextEl = document.getElementById('temp-text');
        const locSpan = document.getElementById('loc-span');
        const capybaraContainer = document.getElementById('capybara-container');
        const speechBubble = document.getElementById('speech-bubble');
        const capybaraText = document.getElementById('capybara-text');
        const voiceRipple = document.getElementById('voice-ripple');
        const aiLoading = document.getElementById('ai-loading');
        const loadingStatus = document.getElementById('loading-status');
        const currencySelect = document.getElementById('currency-select');
        
        const debugLog = document.getElementById('debug-log');
        const debugText = document.getElementById('debug-text');
        const reportModal = document.getElementById('report-modal');
        let pieChartInstance = null;
        let barChartInstance = null;

        function init() {
            updateLatestRecordUI();
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'zh-TW';
                recognition.interimResults = true;
                
                const voiceIcon = btnVoice.querySelector('i');
                const voiceSpan = btnVoice.querySelector('span');
                
                recognition.onstart = () => {
                    isListening = true;
                    currentTempText = "";
                    capybaraContainer.className = 'capybara-listening z-0 absolute inset-0 w-full h-full';
                    voiceRipple.classList.remove('hidden');
                    voiceRipple.classList.replace('bg-orange-300', 'bg-red-300');
                    hideBubble();
                    tempBubbleContainer.classList.remove('hidden');
                    tempTextEl.textContent = '聆聽中...';
                    chatContainer.appendChild(tempBubbleContainer);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    getLocation();
                    
                    voiceIcon.className = 'fa-solid fa-stop text-xl';
                    voiceSpan.textContent = '結束輸入';
                    btnVoice.classList.replace('bg-orange-100', 'bg-red-100');
                    btnVoice.classList.replace('text-orange-700', 'text-red-700');
                    btnVoice.classList.replace('hover:bg-orange-200', 'hover:bg-red-200');
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) currentTempText += event.results[i][0].transcript;
                        else interimTranscript += event.results[i][0].transcript;
                    }
                    tempTextEl.textContent = currentTempText + interimTranscript;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                };

                recognition.onend = () => {
                    isListening = false;
                    resetVoiceButton();
                    tempBubbleContainer.classList.add('hidden');
                    if (currentTempText.trim() !== "") {
                        addRecordToChat(currentTempText, currentLocationStr, new Date());
                    }
                };

                recognition.onerror = () => {
                    isListening = false;
                    tempBubbleContainer.classList.add('hidden');
                    resetVoiceButton();
                };

                btnVoice.addEventListener('click', () => {
                    if (isListening) recognition.stop();
                    else recognition.start();
                });
            } else {
                btnVoice.innerHTML = '<i class="fa-solid fa-keyboard text-xl"></i> <span>無語音支援(點擊)</span>';
                btnVoice.addEventListener('click', () => {
                    const text = prompt("請手動輸入記帳內容：", "例如：早餐買了65元三明治中餐50元便當");
                    if (text) {
                        getLocation();
                        setTimeout(() => addRecordToChat(text, currentLocationStr, new Date()), 500);
                    }
                });
            }

            btnSave.addEventListener('click', handleSaveExpense);
            document.getElementById('btn-report').addEventListener('click', () => { reportModal.classList.remove('translate-y-full'); updateReportUI(); });
            document.getElementById('btn-close-report').addEventListener('click', () => reportModal.classList.add('translate-y-full') );
            currencySelect.addEventListener('change', () => { updateLatestRecordUI(); if(!reportModal.classList.contains('translate-y-full')) updateReportUI(); });
        }

        function resetVoiceButton() {
            const voiceIcon = btnVoice.querySelector('i');
            const voiceSpan = btnVoice.querySelector('span');
            capybaraContainer.className = 'capybara-idle z-0 absolute inset-0 w-full h-full';
            voiceRipple.classList.add('hidden');
            voiceIcon.className = 'fa-solid fa-microphone text-xl';
            voiceSpan.textContent = '語音輸入';
            btnVoice.classList.replace('bg-red-100', 'bg-orange-100');
            btnVoice.classList.replace('text-red-700', 'text-orange-700');
            btnVoice.classList.replace('hover:bg-red-200', 'hover:bg-orange-200');
            voiceRipple.classList.replace('bg-red-300', 'bg-orange-300');
        }

        function getLocation() {
            locSpan.textContent = "定位中...";
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    pos => { currentLocationStr = `Lat: ${pos.coords.latitude.toFixed(3)}, Lon: ${pos.coords.longitude.toFixed(3)}`; locSpan.textContent = "已取得位置"; },
                    () => { currentLocationStr = "無法取得位置"; locSpan.textContent = "未開啟定位"; },
                    { timeout: 3000 }
                );
            } else {
                currentLocationStr = "不支援定位";
                locSpan.textContent = "不支援定位";
            }
        }

        function addRecordToChat(text, location, dateObj) {
            const timeStr = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
            pendingRecords.push({ text: text, time: dateObj.toISOString(), location: location });

            const bubbleItem = document.createElement('div');
            bubbleItem.className = 'flex flex-col items-end w-full chat-bubble-enter bubble-item mb-2';
            bubbleItem.innerHTML = `
                <div class="bg-[#D1FAE5] text-[#064E3B] px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-sm max-w-[85%] text-left break-words text-[15px] leading-relaxed">
                    ${text}
                </div>
                <div class="text-[0.65rem] text-gray-400 mt-1 flex items-center gap-1"><span>${timeStr}</span> · <span>${location}</span></div>
            `;
            chatContainer.insertBefore(bubbleItem, tempBubbleContainer);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            btnSave.disabled = false;
            showRandomPhrase();
        }

        function showRandomPhrase() {
            capybaraText.textContent = capybaraPhrases[Math.floor(Math.random() * capybaraPhrases.length)];
            speechBubble.classList.remove('hidden', 'bubble-enter');
            void speechBubble.offsetWidth; 
            speechBubble.classList.add('bubble-enter');
        }

        function hideBubble() {
            speechBubble.classList.add('hidden');
            speechBubble.classList.remove('bubble-enter');
        }

        async function handleSaveExpense() {
            if (pendingRecords.length === 0) return;

            btnSave.disabled = true;
            btnVoice.disabled = true;

            await playEatingAnimation();
            aiLoading.classList.remove('hidden');
            debugLog.classList.add('hidden');

            try {
                // 執行連續記帳增強版雙引擎
                const newExpenses = await parseExpenseDualEngine(pendingRecords);
                
                // 儲存到 LocalStorage
                newExpenses.forEach(exp => {
                    exp.id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                    exp.currency = currencySelect.value;
                    expenses.push(exp);
                });
                localStorage.setItem('capybara_expenses', JSON.stringify(expenses));

                aiLoading.classList.add('hidden');
                updateLatestRecordUI();
                
                pendingRecords = [];
                chatContainer.innerHTML = '';
                chatContainer.appendChild(tempBubbleContainer);
                
                // 【明細回報】將拆解出來的結果直接顯示在水豚氣泡裡，證明它全部吃到了！
                let summaryHtml = newExpenses.map(e => `${e.category} $${e.amount}`).join("<br>");
                capybaraText.innerHTML = `<span class="font-bold">嗝！幫你記了 ${newExpenses.length} 筆：</span><br><span class="text-xs text-orange-600 font-bold block mt-1">${summaryHtml}</span>`;
                
                speechBubble.classList.remove('hidden');
                speechBubble.classList.add('bubble-enter');

                setTimeout(() => { btnVoice.disabled = false; }, 1000);

            } catch (error) {
                console.error(error);
                aiLoading.classList.add('hidden');
                debugText.innerText = error.message;
                debugLog.classList.remove('hidden');
                
                document.querySelectorAll('.bubble-item').forEach(el => el.style.opacity = '1' );
                btnSave.disabled = false;
                btnVoice.disabled = false;
            }
        }

        // --- 核心：連續記帳增強版雙引擎 (Text Chunking) ---
        async function parseExpenseDualEngine(recordsArray) {
            const currentDateTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
            
            // 【第一步：強制語意切片】
            // 尋找所有的「數字」，以數字為節點將一句話切成多段！
            let expectedCount = 0;
            let preprocessedRecords = [];

            recordsArray.forEach(r => {
                // 避免 7-11 的數字干擾切片
                let text = r.text.replace(/7-?11/gi, "超商");
                // 正則：(前綴文字) + (數字) + (單位) + (後綴文字直到遇到下個數字)
                const matches = [...text.matchAll(/(\D*?)(\d+)\s*(?:元|塊|塊錢|dollar)?(\D*?(?=\d|$))/g)];
                
                if(matches.length > 0) {
                    expectedCount += matches.length;
                    matches.forEach(m => {
                        // 重組出乾淨的區塊：例如 "我早餐買了 65元 三明治中餐"
                        preprocessedRecords.push({ 
                            time: r.time, 
                            text: `${m[1].trim()} ${m[2]}元 ${m[3].trim()}`.trim() 
                        });
                    });
                } else {
                    expectedCount += 1;
                    preprocessedRecords.push({ time: r.time, text: text });
                }
            });

            // 【第二步：呼叫免費 AI 節點】
            loadingStatus.textContent = `發現 ${expectedCount} 筆花費，傳送至 AI...`;
            try {
                const prompt = `你是一個記帳機器人。請將以下的紀錄轉換為 JSON 陣列。
我們已經將使用者的話切分為 ${expectedCount} 筆獨立項目：
${JSON.stringify(preprocessedRecords)}

規定：
1. 你必須回傳一個 JSON 陣列，長度一定要剛好是 ${expectedCount} 筆！
2. 每個物件要有: "date"(ISO時間), "category"(飲食/交通/購物/娛樂/雜支), "amount"(純數字), "description"(抓出買了什麼)。
3. 只回傳 JSON 陣列，不要有 markdown！`;

                const response = await fetch("https://text.pollinations.ai/", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: "user", content: prompt }],
                        jsonMode: true
                    })
                });

                if (response.ok) {
                    let textResult = await response.text();
                    textResult = textResult.replace(/```json/gi, '').replace(/```/g, '').trim();
                    let parsedJson = JSON.parse(textResult);
                    let arr = Array.isArray(parsedJson) ? parsedJson : [parsedJson];
                    
                    // 【雙重防呆】如果 AI 偷懶回傳數量不對，直接判定失敗，交給本地引擎！
                    if (arr.length < expectedCount) {
                        throw new Error("AI 偷懶遺漏項目，切換本地解析");
                    }
                    return arr;
                }
            } catch (err) {
                console.log("AI 節點失敗，啟動本地防彈解析引擎");
            }

            // 【第三步：本機端防彈解析引擎 (斷網保證成功)】
            loadingStatus.textContent = "啟動本地防彈解析引擎...";
            await new Promise(r => setTimeout(r, 400)); // 讓畫面的字稍微停一下
            
            let fallbackResults = [];
            preprocessedRecords.forEach(record => {
                const text = record.text;
                let amount = 0;
                
                // 抓取被我們事前切好的單一數字
                const amtMatch = text.match(/(\d+)/);
                if (amtMatch) amount = parseInt(amtMatch[1]);
                
                // 去除雜訊後抓取關鍵字
                let fullContext = text.replace(/\d+/g, '').replace(/元|塊|塊錢|買了|我|還有|然後|跟|的/g, '').trim();
                
                let category = "雜支";
                if (/吃|便當|麵|飯|餐|宵夜|飲料|水|咖啡|茶|餅乾|全聯|麥當勞|餐廳|三明治|菜|蛋餅|漢堡|包子/.test(fullContext)) category = "飲食";
                else if (/車|捷運|公車|客運|計程車|uber|高鐵|火車|加油|停車|悠遊卡/.test(fullContext)) category = "交通";
                else if (/衣服|褲|鞋|包包|網購|蝦皮|買|家樂福|大潤發|屈臣氏|康是美|超市|商場|超商/.test(fullContext)) category = "購物";
                else if (/電影|唱歌|ktv|遊戲|玩|訂閱|netflix|youtube/.test(fullContext)) category = "娛樂";

                // 若有剩下文字就當品名，否則直接用品類
                let desc = fullContext.substring(0, 15);
                if (desc.length === 0) desc = category;

                fallbackResults.push({
                    date: record.time || new Date().toISOString(),
                    category: category,
                    amount: amount,
                    description: desc
                });
            });

            return fallbackResults;
        }

        // 動畫：吃掉漸隱
        function playEatingAnimation() {
            return new Promise((resolve) => {
                hideBubble();
                capybaraContainer.className = 'capybara-eating z-0 absolute inset-0 w-full h-full';
                
                const svgRect = document.getElementById('capybara-svg').getBoundingClientRect();
                const targetX = svgRect.left + (svgRect.width * 0.5); 
                const targetY = svgRect.top + (svgRect.height * 0.55);

                const items = document.querySelectorAll('.bubble-item');
                let completedCount = 0;
                if (items.length === 0) resolve();

                items.forEach((item, index) => {
                    const rect = item.getBoundingClientRect();
                    const clone = item.cloneNode(true);
                    
                    clone.style.position = 'fixed';
                    clone.style.zIndex = '1000';
                    clone.style.transition = 'all 0.5s cubic-bezier(0.5, 0, 0.2, 1), opacity 0.5s ease-in-out';
                    clone.style.left = `${rect.left}px`;
                    clone.style.top = `${rect.top}px`;
                    clone.style.width = `${rect.width}px`;
                    clone.style.margin = '0';
                    clone.style.transformOrigin = 'center center';
                    document.body.appendChild(clone);
                    item.style.opacity = '0';

                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            clone.style.left = `${targetX - (rect.width / 2)}px`;
                            clone.style.top = `${targetY - (rect.height / 2)}px`;
                            clone.style.transform = 'scale(0.01)';
                            clone.style.opacity = '0';
                        }, index * 100);
                    });

                    setTimeout(() => {
                        clone.remove();
                        completedCount++;
                        if (completedCount === items.length) {
                            capybaraContainer.className = 'capybara-idle z-0 absolute inset-0 w-full h-full';
                            setTimeout(resolve, 300);
                        }
                    }, 500 + index * 100);
                });
            });
        }

        function updateLatestRecordUI() {
            const lrEl = document.getElementById('latest-record');
            if (expenses.length === 0) { lrEl.classList.add('hidden'); return; }
            lrEl.classList.remove('hidden');
            const latest = expenses[expenses.length - 1];
            const sym = currencySymbols[currencySelect.value] || '$';
            document.getElementById('lr-cat').textContent = latest.category;
            document.getElementById('lr-desc').textContent = latest.description;
            document.getElementById('lr-amount').textContent = `${sym}${latest.amount}`;
            const d = new Date(latest.date);
            document.getElementById('lr-time').textContent = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function updateReportUI() {
            if (expenses.length === 0) return;
            const sym = currencySymbols[currencySelect.value] || '$';
            document.getElementById('report-currency-symbol').textContent = sym;

            const now = new Date();
            const monthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}`;
            const monthExpenses = expenses.filter(e => e.date.startsWith(monthStr));
            
            document.getElementById('report-total').textContent = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0).toLocaleString();

            const catMap = {};
            monthExpenses.forEach(e => catMap[e.category] = (catMap[e.category] || 0) + Number(e.amount));
            const pieLabels = Object.keys(catMap);
            const pieData = Object.values(catMap);

            const dayMap = {};
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for(let i=1; i<=daysInMonth; i++) dayMap[String(i).padStart(2, '0')] = 0;
            monthExpenses.forEach(e => {
                const day = e.date.substring(8, 10);
                if(dayMap[day] !== undefined) dayMap[day] += Number(e.amount);
            });
            const barLabels = Object.keys(dayMap).map(d => `${d}日`);
            const barData = Object.values(dayMap);

            renderPieChart(pieLabels, pieData, ['#F59E0B', '#10B981', '#3B82F6', '#EF4444', '#8B5CF6', '#EC4899']);
            renderBarChart(barLabels, barData);
            renderLedgerList(monthExpenses.slice().reverse());
        }

        function renderPieChart(labels, data, colors) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();
            if(data.length === 0) { labels = ['無資料']; data = [1]; colors = ['#E5E7EB']; }
            pieChartInstance = new Chart(ctx, { type: 'doughnut', data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#ffffff' }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } }, cutout: '65%' }});
        }

        function renderBarChart(labels, data) {
            const ctx = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(ctx, { type: 'bar', data: { labels: labels, datasets: [{ label: '每日花費', data: data, backgroundColor: '#60A5FA', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 7 } }, y: { beginAtZero: true, border: { dash: [4, 4] } } } }});
        }

        function renderLedgerList(listData) {
            const container = document.getElementById('ledger-list');
            container.innerHTML = '';
            const sym = currencySymbols[currencySelect.value] || '$';
            if(listData.length === 0) { container.innerHTML = '<p class="text-center text-gray-400 py-4">這個月還沒有花費喔！</p>'; return; }

            listData.forEach(item => {
                const d = new Date(item.date);
                const el = document.createElement('div');
                el.className = 'flex justify-between items-center p-3 hover:bg-orange-50 rounded-xl transition-colors border-b border-gray-50 last:border-0';
                el.innerHTML = `<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-gray-100 flex flex-col items-center justify-center text-xs text-gray-500 font-bold"><span>${d.getDate()}</span></div><div><p class="font-bold text-gray-700">${item.category}</p><p class="text-xs text-gray-400 max-w-[150px] truncate">${item.description}</p></div></div><div class="text-right"><p class="font-bold text-gray-800">${sym}${Number(item.amount).toLocaleString()}</p><p class="text-xs text-gray-400">${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</p></div>`;
                container.appendChild(el);
            });
        }

        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
