<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水豚君語音記帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            overflow: hidden; 
        }

        /* 水豚 SVG 動畫相關 */
        .eye { transition: all 0.2s ease; }
        .mouth { transition: all 0.3s ease; }
        
        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        
        /* 修正眼睛動畫錯位：分別指定左右眼的 transform-origin 座標 */
        #eye-left { transform-origin: 65px 85px; }
        #eye-right { transform-origin: 135px 85px; }
        
        .capybara-idle .eye { animation: blink 4s infinite; }
        .capybara-listening .eye { transform: scale(1.2); fill: #1f2937; }
        .capybara-listening .mouth { d: path('M 80 110 Q 100 120 120 110'); }
        .capybara-eating .mouth { d: path('M 80 110 Q 100 140 120 110 Z'); fill: #4b1a1a; }
        .capybara-eating .eye { transform: scaleY(0.2); }

        /* 對話框與氣泡動畫 */
        .bubble-enter {
            opacity: 0;
            transform: translateY(10px) scale(0.9);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        /* LINE 風格聊天氣泡進場 */
        .chat-bubble-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #d97706;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-[100dvh]">

    <div class="relative w-full max-w-md h-[100dvh] bg-orange-50 shadow-2xl flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="flex justify-between items-center p-4 bg-orange-100/80 backdrop-blur-sm z-10 rounded-b-2xl shadow-sm shrink-0">
            <h1 class="text-xl font-bold text-orange-800 flex items-center gap-2">
                <i class="fa-solid fa-leaf text-green-600"></i> 水豚記帳
            </h1>
            <div class="flex items-center gap-3">
                <button id="btn-report" class="w-10 h-10 rounded-full bg-white text-orange-600 shadow flex items-center justify-center hover:bg-orange-50 transition">
                    <i class="fa-solid fa-chart-pie"></i>
                </button>
                <select id="currency-select" class="bg-white border-none rounded-full py-1.5 px-3 text-sm font-bold text-gray-700 shadow focus:ring-2 focus:ring-orange-300 outline-none">
                    <option value="TWD">TWD ($)</option>
                    <option value="USD">USD ($)</option>
                    <option value="JPY">JPY (¥)</option>
                    <option value="EUR">EUR (€)</option>
                </select>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col items-center justify-start pt-4 px-4 relative overflow-hidden">
            
            <!-- 將對話框與水豚包在同一個相對定位的容器內，確保位置穩固 -->
            <div class="relative w-full flex flex-col items-center mt-4 mb-2 shrink-0">
                <!-- Speech Bubble (水豚講話) -->
                <div id="speech-bubble" class="absolute -top-4 left-1/2 -translate-x-1/2 w-4/5 max-w-[280px] bg-white p-3 rounded-2xl shadow-md border-2 border-orange-200 opacity-0 hidden z-10">
                    <p id="capybara-text" class="text-gray-700 font-medium text-center text-sm leading-relaxed">...</p>
                    <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[10px] border-l-transparent border-t-[15px] border-t-white border-r-[10px] border-r-transparent filter drop-shadow(0 2px 2px rgba(0,0,0,0.05))"></div>
                </div>

                <!-- Capybara SVG -->
                <!-- 調整 margin-top 預留氣泡空間 -->
                <div id="capybara-container" class="mt-12 relative z-0 capybara-idle">
                    <svg width="160" height="160" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="capybara-svg">
                        <ellipse cx="100" cy="120" rx="80" ry="70" fill="#A87B51" />
                        <ellipse cx="40" cy="80" rx="15" ry="10" fill="#8B5A2B" transform="rotate(-30 40 80)" />
                        <ellipse cx="160" cy="80" rx="15" ry="10" fill="#8B5A2B" transform="rotate(30 160 80)" />
                        <ellipse cx="100" cy="100" rx="40" ry="30" fill="#C19A6B" />
                        <ellipse cx="100" cy="85" rx="12" ry="6" fill="#4A3018" />
                        <!-- 加上 ID 方便 CSS 精準選取 -->
                        <circle cx="65" cy="85" r="5" fill="#2D1A11" class="eye" id="eye-left" />
                        <circle cx="135" cy="85" r="5" fill="#2D1A11" class="eye" id="eye-right" />
                        <path d="M 80 110 Q 100 110 120 110" stroke="#4A3018" stroke-width="3" fill="none" class="mouth" id="mouth" />
                    </svg>
                </div>
            </div>

            <!-- LINE 風格對話紀錄區 (Chat History) -->
            <div id="chat-container" class="w-full flex-1 overflow-y-auto no-scrollbar flex flex-col items-end pb-4 pt-2 space-y-4">
                <!-- 暫時輸入中的氣泡 -->
                <div id="temp-bubble-container" class="w-full flex flex-col items-end hidden chat-bubble-enter">
                    <div class="bg-gray-200 text-gray-600 px-4 py-3 rounded-2xl rounded-tr-sm shadow-sm max-w-[85%] text-left">
                        <span id="temp-text" class="animate-pulse">聆聽中...</span>
                    </div>
                    <div class="text-[0.65rem] text-gray-400 mt-1 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot"></i> <span id="loc-span">定位中...</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- Bottom Controls -->
        <footer class="bg-white p-6 rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20 shrink-0">
            <div class="flex justify-between items-center gap-4">
                <button id="btn-voice" class="flex-1 bg-orange-100 hover:bg-orange-200 text-orange-700 py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 transition-colors relative overflow-hidden">
                    <i class="fa-solid fa-microphone text-xl"></i> 
                    <span>語音輸入</span>
                    <div id="voice-ripple" class="absolute inset-0 bg-orange-300 opacity-20 hidden animate-pulse"></div>
                </button>
                
                <button id="btn-save" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center gap-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <i class="fa-solid fa-coins"></i> 
                    <span>開始記帳</span>
                </button>
            </div>
            
            <div id="latest-record" class="mt-4 p-3 bg-gray-50 rounded-xl flex justify-between items-center text-sm border border-gray-100 hidden">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-orange-200 flex items-center justify-center text-orange-700">
                        <i class="fa-solid fa-receipt"></i>
                    </div>
                    <div>
                        <p id="lr-cat" class="font-bold text-gray-700">分類</p>
                        <p id="lr-desc" class="text-xs text-gray-500">描述</p>
                    </div>
                </div>
                <div class="text-right">
                    <p id="lr-amount" class="font-bold text-orange-600 text-base">$0</p>
                    <p id="lr-time" class="text-xs text-gray-400">時間</p>
                </div>
            </div>
        </footer>

        <!-- Loading Overlay for AI -->
        <div id="ai-loading" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
            <div class="loader mb-4"></div>
            <p class="text-orange-800 font-bold animate-pulse mt-2">正在呼叫 AI 結算中...</p>
        </div>

        <!-- 報表 Modal -->
        <div id="report-modal" class="absolute inset-0 bg-white z-50 transform translate-y-full transition-transform duration-300 flex flex-col">
            <header class="flex justify-between items-center p-4 bg-orange-50 border-b border-orange-100 shrink-0">
                <h2 class="text-xl font-bold text-orange-800">花費報表</h2>
                <button id="btn-close-report" class="w-8 h-8 rounded-full bg-white text-gray-500 shadow flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>
            <div class="flex-1 overflow-y-auto p-4 no-scrollbar pb-20">
                <div class="bg-gradient-to-r from-orange-400 to-amber-500 rounded-2xl p-5 text-white shadow-lg mb-6">
                    <p class="text-orange-50 text-sm font-medium mb-1">本月總花費</p>
                    <div class="flex items-baseline gap-2">
                        <span id="report-currency-symbol" class="text-2xl font-bold">$</span>
                        <span id="report-total" class="text-4xl font-extrabold">0</span>
                    </div>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50 mb-6">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-orange-400"></i> 當月分類佔比
                    </h3>
                    <div class="relative h-48 w-full flex justify-center">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50 mb-6">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-blue-400"></i> 每日花費起伏
                    </h3>
                    <div class="relative h-48 w-full">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow border border-gray-50">
                    <h3 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-list-ul text-green-400"></i> 詳細帳本
                    </h3>
                    <div id="ledger-list" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const apiKey = "AIzaSyCHZCGkOXQ3VA33WsZEwYp8VdVC5eYISmk"; // 本地端測試時，請務必將你的 AIza... 金鑰貼在引號內
        
        let pendingRecords = []; 
        let currentTempText = "";
        let currentLocationStr = "";
        let isListening = false;
        let expenses = JSON.parse(localStorage.getItem('capybara_expenses')) || [];
        
        const currencySymbols = { TWD: '$', USD: '$', JPY: '¥', EUR: '€' };
        
        const capybaraPhrases = [
            "記下來了！還有嗎？",
            "省下來的錢可以買更多草喔！",
            "錢錢沒有不見~",
            "收到！交給我吧 (๑•̀ㅂ•́)و✧",
            "這筆記好了，要直接開始記帳嗎？"
        ];

        // DOM
        const btnVoice = document.getElementById('btn-voice');
        const btnSave = document.getElementById('btn-save');
        const chatContainer = document.getElementById('chat-container');
        const tempBubbleContainer = document.getElementById('temp-bubble-container');
        const tempTextEl = document.getElementById('temp-text');
        const locSpan = document.getElementById('loc-span');
        
        const capybaraContainer = document.getElementById('capybara-container');
        const speechBubble = document.getElementById('speech-bubble');
        const capybaraText = document.getElementById('capybara-text');
        const voiceRipple = document.getElementById('voice-ripple');
        const aiLoading = document.getElementById('ai-loading');
        const currencySelect = document.getElementById('currency-select');
        
        const reportModal = document.getElementById('report-modal');
        let pieChartInstance = null;
        let barChartInstance = null;

        function init() {
            updateLatestRecordUI();
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = 'zh-TW';
                recognition.interimResults = true;
                
                const voiceIcon = btnVoice.querySelector('i');
                const voiceSpan = btnVoice.querySelector('span');
                
                recognition.onstart = () => {
                    isListening = true;
                    currentTempText = "";
                    capybaraContainer.className = 'mt-12 relative z-0 capybara-listening';
                    voiceRipple.classList.remove('hidden');
                    voiceRipple.classList.replace('bg-orange-300', 'bg-red-300');
                    
                    hideBubble();
                    tempBubbleContainer.classList.remove('hidden');
                    tempTextEl.textContent = '聆聽中...';
                    chatContainer.appendChild(tempBubbleContainer); // 確保在最下方
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                    
                    getLocation();
                    
                    voiceIcon.className = 'fa-solid fa-stop text-xl';
                    voiceSpan.textContent = '結束輸入';
                    btnVoice.classList.replace('bg-orange-100', 'bg-red-100');
                    btnVoice.classList.replace('text-orange-700', 'text-red-700');
                    btnVoice.classList.replace('hover:bg-orange-200', 'hover:bg-red-200');
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            currentTempText += event.results[i][0].transcript;
                        } else {
                            interimTranscript += event.results[i][0].transcript;
                        }
                    }
                    tempTextEl.textContent = currentTempText + interimTranscript;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                };

                recognition.onend = () => {
                    isListening = false;
                    capybaraContainer.className = 'mt-12 relative z-0 capybara-idle';
                    voiceRipple.classList.add('hidden');
                    
                    voiceIcon.className = 'fa-solid fa-microphone text-xl';
                    voiceSpan.textContent = '語音輸入';
                    btnVoice.classList.replace('bg-red-100', 'bg-orange-100');
                    btnVoice.classList.replace('text-red-700', 'text-orange-700');
                    btnVoice.classList.replace('hover:bg-red-200', 'hover:bg-orange-200');
                    voiceRipple.classList.replace('bg-red-300', 'bg-orange-300');
                    
                    tempBubbleContainer.classList.add('hidden');

                    if (currentTempText.trim() !== "") {
                        addRecordToChat(currentTempText, currentLocationStr, new Date());
                    }
                };

                recognition.onerror = (event) => {
                    isListening = false;
                    tempBubbleContainer.classList.add('hidden');
                    resetVoiceButton();
                };

                btnVoice.addEventListener('click', () => {
                    if (isListening) recognition.stop();
                    else recognition.start();
                });
            } else {
                // 無語音支援的 Fallback
                btnVoice.innerHTML = '<i class="fa-solid fa-keyboard text-xl"></i> <span>無語音支援(點擊輸入)</span>';
                btnVoice.addEventListener('click', () => {
                    const text = prompt("請手動輸入記帳內容：", "剛剛買了便當和飲料150元");
                    if (text) {
                        getLocation();
                        setTimeout(() => {
                            addRecordToChat(text, currentLocationStr, new Date());
                        }, 500); // 稍微延遲讓定位抓一下
                    }
                });
            }

            btnSave.addEventListener('click', handleSaveExpense);
            document.getElementById('btn-report').addEventListener('click', openReport);
            document.getElementById('btn-close-report').addEventListener('click', () => {
                reportModal.classList.add('translate-y-full');
            });
            currencySelect.addEventListener('change', () => {
                updateLatestRecordUI();
                if(!reportModal.classList.contains('translate-y-full')) updateReportUI();
            });
        }

        function resetVoiceButton() {
            const voiceIcon = btnVoice.querySelector('i');
            const voiceSpan = btnVoice.querySelector('span');
            capybaraContainer.className = 'mt-12 relative z-0 capybara-idle';
            voiceRipple.classList.add('hidden');
            voiceIcon.className = 'fa-solid fa-microphone text-xl';
            voiceSpan.textContent = '語音輸入';
            btnVoice.classList.replace('bg-red-100', 'bg-orange-100');
            btnVoice.classList.replace('text-red-700', 'text-orange-700');
            btnVoice.classList.replace('hover:bg-red-200', 'hover:bg-orange-200');
            voiceRipple.classList.replace('bg-red-300', 'bg-orange-300');
        }

        function getLocation() {
            locSpan.textContent = "定位中...";
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        currentLocationStr = `Lat: ${lat.toFixed(3)}, Lon: ${lon.toFixed(3)}`;
                        locSpan.textContent = "已取得位置";
                    },
                    () => {
                        currentLocationStr = "無法取得位置";
                        locSpan.textContent = "未開啟定位";
                    },
                    { timeout: 3000 }
                );
            } else {
                currentLocationStr = "不支援定位";
                locSpan.textContent = "不支援定位";
            }
        }

        // 加入新對話氣泡到畫面
        function addRecordToChat(text, location, dateObj) {
            const timeStr = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
            
            pendingRecords.push({
                text: text,
                time: dateObj.toISOString(),
                location: location
            });

            const bubbleItem = document.createElement('div');
            bubbleItem.className = 'flex flex-col items-end w-full chat-bubble-enter bubble-item mb-2';
            bubbleItem.innerHTML = `
                <div class="bg-[#D1FAE5] text-[#064E3B] px-4 py-2.5 rounded-2xl rounded-tr-sm shadow-sm max-w-[85%] text-left break-words text-[15px] leading-relaxed">
                    ${text}
                </div>
                <div class="text-[0.65rem] text-gray-400 mt-1 flex items-center gap-1">
                    <span>${timeStr}</span> · <span>${location}</span>
                </div>
            `;
            chatContainer.insertBefore(bubbleItem, tempBubbleContainer);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            btnSave.disabled = false;
            showRandomPhrase();
        }

        function showRandomPhrase() {
            const phrase = capybaraPhrases[Math.floor(Math.random() * capybaraPhrases.length)];
            capybaraText.textContent = phrase;
            speechBubble.classList.remove('hidden');
            speechBubble.classList.remove('bubble-enter');
            void speechBubble.offsetWidth; 
            speechBubble.classList.add('bubble-enter');
        }

        function hideBubble() {
            speechBubble.classList.add('hidden');
            speechBubble.classList.remove('bubble-enter');
        }

        // 核心流程：先動畫 -> 後 API -> 更新報表
        async function handleSaveExpense() {
            if (pendingRecords.length === 0) return;
            
            btnSave.disabled = true;
            btnVoice.disabled = true;

            // 1. 執行吃掉對話氣泡的動畫
            await playEatingAnimation();

            // 2. 顯示正在呼叫 API 的 Loading
            aiLoading.classList.remove('hidden');

            try {
                // 3. 呼叫 Gemini API 進行解析 (將多筆資料轉給 AI)
                const newExpenses = await parseExpenseWithAI(pendingRecords);
                
                // 4. 儲存資料
                newExpenses.forEach(exp => {
                    exp.id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                    exp.currency = currencySelect.value;
                    expenses.push(exp);
                });
                localStorage.setItem('capybara_expenses', JSON.stringify(expenses));

                // 5. 更新 UI
                aiLoading.classList.add('hidden');
                updateLatestRecordUI();
                
                // 清空狀態
                pendingRecords = [];
                chatContainer.innerHTML = '';
                chatContainer.appendChild(tempBubbleContainer); // 放回預備氣泡
                
                capybaraText.textContent = "記帳完成！可以直接看報表囉！";
                speechBubble.classList.remove('hidden');
                speechBubble.classList.add('bubble-enter');

                setTimeout(() => {
                    btnVoice.disabled = false;
                }, 1000);

            } catch (error) {
                console.error(error);
                aiLoading.classList.add('hidden');
                
                // 產生易讀的錯誤訊息
                let errorMsg = error.message;
                if (errorMsg.includes('404') || errorMsg.includes('400')) {
                    errorMsg += "\n\n(請確保代碼開頭的 apiKey 變數有填寫正確的金鑰)";
                }
                alert("解析失敗，請再試一次！錯誤：" + errorMsg);
                
                // 發生錯誤時恢復對話氣泡顯示
                document.querySelectorAll('.bubble-item').forEach(el => {
                    el.style.opacity = '1';
                });
                btnSave.disabled = false;
                btnVoice.disabled = false;
            }
        }

        // 動畫實作 (已為手機端大幅優化座標計算方式)
        function playEatingAnimation() {
            return new Promise((resolve) => {
                hideBubble();
                capybaraContainer.className = 'mt-12 relative z-0 capybara-eating';
                
                // 抓整張 SVG 的大小，然後用比例算出嘴巴的絕對位置，避免手機端 <path> 定位錯亂
                const svgRect = document.getElementById('capybara-svg').getBoundingClientRect();
                const targetX = svgRect.left + (svgRect.width * 0.5);  // SVG 的正中間 X
                const targetY = svgRect.top + (svgRect.height * 0.55); // 嘴巴大約在高度 55% 的位置

                const items = document.querySelectorAll('.bubble-item');
                let completedCount = 0;

                if (items.length === 0) resolve();

                items.forEach((item, index) => {
                    const rect = item.getBoundingClientRect();
                    const clone = item.cloneNode(true);
                    
                    // 設定飛行元素的初始樣式與中心基準點
                    clone.style.position = 'fixed';
                    clone.style.zIndex = '1000';
                    clone.style.transition = 'all 0.6s cubic-bezier(0.5, 0, 0.2, 1)';
                    clone.style.left = `${rect.left}px`;
                    clone.style.top = `${rect.top}px`;
                    clone.style.width = `${rect.width}px`;
                    clone.style.margin = '0';
                    clone.style.transformOrigin = 'center center'; // 確保以中心點縮小
                    document.body.appendChild(clone);

                    // 隱藏原本列表中的氣泡
                    item.style.opacity = '0';

                    // 觸發移動與縮小動畫 (加上微小延遲製造接連飛入的感覺)
                    requestAnimationFrame(() => {
                        setTimeout(() => {
                            // 計算目標左上角，讓元素中心對齊 targetX / targetY
                            clone.style.left = `${targetX - (rect.width / 2)}px`;
                            clone.style.top = `${targetY - (rect.height / 2)}px`;
                            clone.style.transform = 'scale(0.1)';
                            clone.style.opacity = '0';
                        }, index * 100);
                    });

                    // 動畫結束清理
                    setTimeout(() => {
                        clone.remove();
                        completedCount++;
                        if (completedCount === items.length) {
                            capybaraContainer.className = 'mt-12 relative z-0 capybara-idle';
                            capybaraText.textContent = "嗝！好吃！(๑´ڡ`๑)";
                            speechBubble.classList.remove('hidden');
                            speechBubble.classList.add('bubble-enter');
                            // 延遲一下讓打嗝顯示一陣子再 resolve
                            setTimeout(resolve, 600);
                        }
                    }, 600 + index * 100);
                });
            });
        }

        async function parseExpenseWithAI(recordsArray) {
            const currentDateTime = new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' });
            const recordsJson = JSON.stringify(recordsArray, null, 2);
            
            const prompt = `
請作為一個專業的記帳助理，根據以下使用者的多筆語音紀錄，提取並整理成記帳資訊。

【輸入資料】
當前時間：${currentDateTime}
語音紀錄清單（包含每筆紀錄的輸入時間與地點）：
${recordsJson}

【處理規則】
1. 分析文本中的時間，如果提到相對時間（如「昨天晚上」），請以該筆紀錄的「輸入時間」推算出正確的 ISO 格式時間 (YYYY-MM-DDTHH:mm)。若無提及，就直接使用該筆紀錄的輸入時間。
2. 自動判斷分類。將細項歸類為大項目（如：飲食、交通、娛樂、購物、雜支）。盡量使用兩到三個字。
3. 提取純數字的金額 (amount)。
4. 簡短描述買了什麼 (description)。

【輸出格式】
請務必只回傳合法的 JSON 格式「陣列 (Array)」，不要有 Markdown 標記 (不要有 \`\`\`json)，即使只有一筆也要用陣列包起來，格式範例如下：
[
  {
    "date": "YYYY-MM-DDTHH:mm",
    "category": "飲食",
    "amount": 150,
    "description": "便當和飲料"
  }
]`;

            // 預設使用 Canvas 專屬預覽模型
            let currentModel = "gemini-2.5-flash-preview-09-2025";
            
            // 如果我們偵測到程式碼內有填入你的金鑰，預先切換成大家都能用的 1.5-flash
            if (apiKey && apiKey.trim().length > 0) {
                currentModel = "gemini-1.5-flash";
            }

            let retries = 2;
            let delay = 1000;
            
            while (retries >= 0) {
                try {
                    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`;
                    
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    // === 【超強防呆與自動備援機制】 ===
                    // 如果 API 報錯 404，通常代表當前金鑰無法存取預覽模型 (例如複製到了本地端)。
                    // 我們在這裡直接捕獲錯誤，自動降級切換為通用版的 1.5-flash 並立即重新嘗試！
                    if (response.status === 404 && currentModel === "gemini-2.5-flash-preview-09-2025") {
                        console.warn("404 Not Found: 預覽模型不可用，自動切換至 gemini-1.5-flash 模型重試");
                        currentModel = "gemini-1.5-flash";
                        continue; // 不扣除 retry 額度，立即重新執行 while 迴圈
                    }

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    let textResult = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!textResult) throw new Error("無效的 API 回應");
                    
                    // 過濾 LLM 偶爾會加上的 markdown json 標籤
                    textResult = textResult.replace(/```json/gi, '').replace(/```/g, '').trim();
                    
                    let parsedJson = JSON.parse(textResult);
                    if (!Array.isArray(parsedJson)) {
                        parsedJson = [parsedJson]; // 防呆：如果 LLM 回傳單一物件，強制轉為陣列
                    }
                    
                    return parsedJson;

                } catch (error) {
                    if (retries === 0) throw error;
                    retries--;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        function updateLatestRecordUI() {
            const lrEl = document.getElementById('latest-record');
            if (expenses.length === 0) {
                lrEl.classList.add('hidden');
                return;
            }
            
            lrEl.classList.remove('hidden');
            const latest = expenses[expenses.length - 1];
            const sym = currencySymbols[currencySelect.value] || '$';
            
            document.getElementById('lr-cat').textContent = latest.category;
            document.getElementById('lr-desc').textContent = latest.description;
            document.getElementById('lr-amount').textContent = `${sym}${latest.amount}`;
            
            const d = new Date(latest.date);
            document.getElementById('lr-time').textContent = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        function openReport() {
            reportModal.classList.remove('translate-y-full');
            updateReportUI();
        }

        function updateReportUI() {
            if (expenses.length === 0) return;

            const sym = currencySymbols[currencySelect.value] || '$';
            document.getElementById('report-currency-symbol').textContent = sym;

            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}`;
            const monthExpenses = expenses.filter(e => e.date.startsWith(currentMonthStr));
            
            const total = monthExpenses.reduce((sum, e) => sum + Number(e.amount), 0);
            document.getElementById('report-total').textContent = total.toLocaleString();

            const catMap = {};
            monthExpenses.forEach(e => {
                catMap[e.category] = (catMap[e.category] || 0) + Number(e.amount);
            });
            
            const pieLabels = Object.keys(catMap);
            const pieData = Object.values(catMap);
            const pieColors = ['#F59E0B', '#10B981', '#3B82F6', '#EF4444', '#8B5CF6', '#EC4899'];

            const dayMap = {};
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for(let i=1; i<=daysInMonth; i++) dayMap[String(i).padStart(2, '0')] = 0;
            
            monthExpenses.forEach(e => {
                const day = e.date.substring(8, 10);
                if(dayMap[day] !== undefined) dayMap[day] += Number(e.amount);
            });
            const barLabels = Object.keys(dayMap).map(d => `${d}日`);
            const barData = Object.values(dayMap);

            renderPieChart(pieLabels, pieData, pieColors);
            renderBarChart(barLabels, barData);
            renderLedgerList(monthExpenses.slice().reverse());
        }

        function renderPieChart(labels, data, colors) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            if (pieChartInstance) pieChartInstance.destroy();
            if(data.length === 0) { labels = ['無資料']; data = [1]; colors = ['#E5E7EB']; }

            pieChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#ffffff' }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { font: { family: "'Noto Sans TC', sans-serif" } } } },
                    cutout: '65%'
                }
            });
        }

        function renderBarChart(labels, data) {
            const ctx = document.getElementById('barChart').getContext('2d');
            if (barChartInstance) barChartInstance.destroy();

            barChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: '每日花費', data: data, backgroundColor: '#60A5FA', borderRadius: 4 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { maxTicksLimit: 7 } },
                        y: { beginAtZero: true, border: { dash: [4, 4] }, grid: { color: '#F3F4F6' } }
                    }
                }
            });
        }

        function renderLedgerList(listData) {
            const container = document.getElementById('ledger-list');
            container.innerHTML = '';
            const sym = currencySymbols[currencySelect.value] || '$';

            if(listData.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-400 py-4">這個月還沒有花費喔！</p>';
                return;
            }

            listData.forEach(item => {
                const d = new Date(item.date);
                const el = document.createElement('div');
                el.className = 'flex justify-between items-center p-3 hover:bg-orange-50 rounded-xl transition-colors border-b border-gray-50 last:border-0';
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-gray-100 flex flex-col items-center justify-center text-xs text-gray-500 font-bold">
                            <span>${d.getDate()}</span>
                        </div>
                        <div>
                            <p class="font-bold text-gray-700">${item.category}</p>
                            <p class="text-xs text-gray-400 max-w-[150px] truncate" title="${item.description}">${item.description}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-gray-800">${sym}${Number(item.amount).toLocaleString()}</p>
                        <p class="text-xs text-gray-400">${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</p>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        window.addEventListener('DOMContentLoaded', init);

    </script>
