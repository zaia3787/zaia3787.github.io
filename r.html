<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片分類識別工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- 使用 FileSaver.js 協助儲存下載檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .canvas-container { position: relative; overflow: auto; max-height: 50vh; border: 1px solid #d1d5db; background-color: #e5e7eb; }
        #canvasBase, #canvasOverlay { position: absolute; top: 0; left: 0; }
        #canvasOverlay { pointer-events: none; }
        .key-hint { display: inline-block; padding: 4px 10px; background-color: #1f2937; color: white; border-radius: 6px; font-family: monospace; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body class="flex flex-col h-screen text-gray-800">

    <!-- 頂部資訊列 -->
    <header class="bg-white shadow-sm flex flex-col z-10">
        <div class="p-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-gray-800">影像分類識別系統 (16x16)</h1>
                <p class="text-sm text-gray-500 mt-1">讀取 ZIP 檔，並根據檔名進行拼圖與分類</p>
            </div>
            <div class="flex items-center gap-4">
                <input type="file" id="zipInput" accept=".zip" class="hidden" />
                <label for="zipInput" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded cursor-pointer transition">
                    1. 上傳 ZIP 檔案
                </label>
                <button id="exportBtn" disabled class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed transition">
                    匯出分類 ZIP
                </button>
            </div>
        </div>
        <!-- 拼圖校正設定區 -->
        <div class="bg-yellow-50 px-4 py-2 text-sm flex items-center gap-6 border-t border-gray-200">
            <span class="font-bold text-yellow-800">🔧 拼圖排版校正：</span>
            <label class="flex items-center gap-1 cursor-pointer text-gray-700 hover:text-blue-600 transition" title="若拼圖出現上下錯位，請嘗試勾選/取消此選項">
                <input type="checkbox" id="invertYCheckbox" checked class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"> 
                Y 軸反轉 (將 Y 座標視為由下往上)
            </label>
            <label class="flex items-center gap-1 cursor-pointer text-gray-700 hover:text-blue-600 transition" title="若拼出來的圖片寬高比例不對，請嘗試勾選此選項">
                <input type="checkbox" id="swapXYCheckbox" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500"> 
                X/Y 座標對調
            </label>
            <span class="text-xs text-gray-500 ml-auto">(修改後會即時重新拼圖，不影響已分類進度)</span>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 flex p-4 gap-4 overflow-hidden">
        
        <!-- 左側：拼圖概覽區 -->
        <section class="flex-1 bg-white rounded-lg shadow-sm flex flex-col overflow-hidden border border-gray-200">
            <div class="p-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-semibold">整體拼圖預覽 (綠框為目前位置)</h2>
                <span id="currentBaseName" class="text-sm font-mono text-gray-600">尚未載入</span>
            </div>
            <div class="canvas-container flex-1" id="canvasWrapper">
                <!-- 兩個 Canvas，一個畫底圖，一個畫綠色框框避免每次重繪 -->
                <canvas id="canvasBase"></canvas>
                <canvas id="canvasOverlay"></canvas>
            </div>
        </section>

        <!-- 右側：當前操作區 -->
        <section class="w-96 bg-white rounded-lg shadow-sm flex flex-col overflow-hidden border border-gray-200">
            <div class="p-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <h2 class="font-semibold">目前圖片 (放大檢視)</h2>
                <span id="progressText" class="text-sm font-bold text-blue-600">0 / 0</span>
            </div>
            
            <div class="flex-1 p-6 flex flex-col items-center justify-center">
                <div class="w-16 h-16 border-2 border-dashed border-gray-300 rounded flex items-center justify-center bg-gray-100 overflow-hidden mb-4 relative">
                    <img id="currentImg" class="w-full h-full object-contain [image-rendering:pixelated] hidden" />
                    <span id="imgPlaceholder" class="text-gray-400">尚未載入圖片</span>
                    
                    <!-- 分類標籤覆蓋層 -->
                    <div id="statusBadge" class="absolute top-2 right-2 px-2 py-1 rounded text-xs font-bold text-white hidden"></div>
                </div>

                <div class="text-center mb-6">
                    <p id="currentFilename" class="font-mono text-sm text-gray-600 break-all mb-1">---</p>
                    <p id="currentCoords" class="text-[11px] text-gray-500">X: -, Y: -</p>
                </div>

                <!-- 操作說明 -->
                <div class="w-full bg-blue-50 border border-blue-100 rounded-lg p-4 text-sm space-y-3">
                    <div class="flex items-center justify-between p-2 bg-white rounded border border-gray-100 shadow-sm">
                        <span><span class="key-hint">1</span> Gravel</span>
                        <span class="text-gray-400 text-xs">礫石</span>
                    </div>
                    <div class="flex items-center justify-between p-2 bg-white rounded border border-gray-100 shadow-sm">
                        <span><span class="key-hint">2</span> Coarse_Sand</span>
                        <span class="text-gray-400 text-xs">粗砂</span>
                    </div>
                    <div class="flex items-center justify-between p-2 bg-white rounded border border-gray-100 shadow-sm">
                        <span><span class="key-hint">3</span> Fine_Sand</span>
                        <span class="text-gray-400 text-xs">細砂</span>
                    </div>
                    <hr class="border-gray-200 my-2">
                    <div class="flex items-center justify-between p-2">
                        <span><span class="key-hint">Q</span> 返回上一個</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- 載入中的遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl text-center">
            <div class="inline-block animate-spin w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full mb-4"></div>
            <p id="loadingText" class="font-bold text-gray-700">正在處理檔案，請稍候...</p>
        </div>
    </div>

    <script>
        // 核心狀態變數
        let imageItems = []; // 儲存所有圖片資訊的陣列
        let currentIndex = -1; // 目前正在分類的圖片索引
        let baseGroups = {}; // 根據檔名 Base 分類的群組 (用於拼圖)
        let currentActiveBase = ''; // 目前顯示的拼圖底圖名稱
        
        // DOM 元素參考
        const zipInput = document.getElementById('zipInput');
        const exportBtn = document.getElementById('exportBtn');
        const canvasBase = document.getElementById('canvasBase');
        const ctxBase = canvasBase.getContext('2d', { willReadFrequently: true });
        const canvasOverlay = document.getElementById('canvasOverlay');
        const ctxOverlay = canvasOverlay.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');
        
        const currentImg = document.getElementById('currentImg');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        const progressText = document.getElementById('progressText');
        const currentFilename = document.getElementById('currentFilename');
        const currentCoords = document.getElementById('currentCoords');
        const currentBaseNameLabel = document.getElementById('currentBaseName');
        const statusBadge = document.getElementById('statusBadge');
        
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        // 定義分類項目
        const CATEGORIES = {
            '1': { name: 'Gravel', color: '#ef4444' },      // Red
            '2': { name: 'Coarse_Sand', color: '#f59e0b' }, // Yellow/Orange
            '3': { name: 'Fine_Sand', color: '#3b82f6' }    // Blue
        };

        // 計算實際畫布座標並排序的函數
        function calculateCoordinatesAndSort() {
            const invertY = document.getElementById('invertYCheckbox').checked;
            const swapXY = document.getElementById('swapXYCheckbox').checked;

            // 1. 計算每個 baseGroup 的最大 X 與最大 Y
            for (const baseName in baseGroups) {
                let maxX = 0;
                let maxY = 0;
                baseGroups[baseName].items.forEach(item => {
                    let currentX = swapXY ? item.fileY : item.fileX;
                    let currentY = swapXY ? item.fileX : item.fileY;
                    if (currentX > maxX) maxX = currentX;
                    if (currentY > maxY) maxY = currentY;
                });
                baseGroups[baseName].maxX = maxX;
                baseGroups[baseName].maxY = maxY;

                // 2. 計算每個 item 最終在畫布上的 x, y 座標
                baseGroups[baseName].items.forEach(item => {
                    let currentX = swapXY ? item.fileY : item.fileX;
                    let currentY = swapXY ? item.fileX : item.fileY;
                    
                    item.x = currentX;
                    // 如果勾選反轉 Y，則將 Y 座標倒過來 (MaxY - CurrentY)
                    item.y = invertY ? (maxY - currentY) : currentY;
                });
            }
            
            // 3. 記住當前索引對應的檔名，避免重排後跳到別張圖
            let currentFilename = '';
            if (currentIndex >= 0 && currentIndex < imageItems.length) {
                currentFilename = imageItems[currentIndex].filename;
            }

            // 4. 根據「畫布座標 (x, y)」重新排序，符合人類閱讀順序 (由上到下，由左到右)
            imageItems.sort((a, b) => {
                if (a.baseName !== b.baseName) return a.baseName.localeCompare(b.baseName);
                if (a.y !== b.y) return a.y - b.y;
                return a.x - b.x;
            });

            // 5. 找回原本在看的圖片 currentIndex
            if (currentFilename) {
                currentIndex = imageItems.findIndex(item => item.filename === currentFilename);
                if (currentIndex === -1) currentIndex = 0;
            }
        }

        // 手動切換校正設定時觸發
        function applyTransform() {
            if (imageItems.length === 0) return;
            
            calculateCoordinatesAndSort();
            
            // 強制重新繪製底圖
            currentActiveBase = '';
            updateUI();
        }

        document.getElementById('invertYCheckbox').addEventListener('change', applyTransform);
        document.getElementById('swapXYCheckbox').addEventListener('change', applyTransform);

        // 監聽 ZIP 上傳
        zipInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            showLoading('正在讀取 ZIP 檔案...');
            
            try {
                // 重置狀態
                imageItems = [];
                baseGroups = {};
                currentIndex = -1;
                currentActiveBase = '';
                
                const zip = await JSZip.loadAsync(file);
                const promises = [];

                zip.forEach((relativePath, zipEntry) => {
                    // 略過資料夾與非圖片檔案
                    if (zipEntry.dir || !relativePath.match(/\.(jpg|jpeg|png)$/i)) return;

                    promises.push(
                        zipEntry.async('blob').then(blob => {
                            const filename = zipEntry.name.split('/').pop(); // 取檔名
                            
                            // 解析檔名，格式: 檔名_X_Y.jpg
                            const match = filename.match(/(.*)_(\d+)_(\d+)\.(jpg|jpeg|png)$/i);
                            
                            if (match) {
                                const baseName = match[1];
                                const fileX = parseInt(match[2], 10);
                                const fileY = parseInt(match[3], 10);
                                const url = URL.createObjectURL(blob);

                                const item = {
                                    filename: filename,
                                    baseName: baseName,
                                    fileX: fileX, // 記錄原始檔名上的 X
                                    fileY: fileY, // 記錄原始檔名上的 Y
                                    x: 0, // 畫布 X，稍後由函數計算
                                    y: 0, // 畫布 Y，稍後由函數計算
                                    blob: blob,
                                    url: url,
                                    imgElement: null, // 稍後建立
                                    category: null // 使用者分類的結果
                                };
                                
                                imageItems.push(item);

                                // 記錄 Base 群組
                                if (!baseGroups[baseName]) {
                                    baseGroups[baseName] = { maxX: 0, maxY: 0, items: [] };
                                }
                                baseGroups[baseName].items.push(item);
                            }
                        })
                    );
                });

                await Promise.all(promises);

                if (imageItems.length === 0) {
                    alert('找不到符合格式 (檔名_X_Y.jpg) 的圖片！');
                    hideLoading();
                    return;
                }

                showLoading('正在產生預覽拼圖，這可能需要一點時間...');

                // 根據當前打勾狀態，計算座標並排序
                calculateCoordinatesAndSort();

                // 預先載入所有 Image 物件供 Canvas 繪圖使用
                const imgLoadPromises = imageItems.map(item => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.onload = () => {
                            item.imgElement = img;
                            resolve();
                        };
                        img.onerror = resolve; // 錯誤也繼續
                        img.src = item.url;
                    });
                });

                await Promise.all(imgLoadPromises);

                // 啟用匯出按鈕並開始分類流程
                exportBtn.disabled = false;
                currentIndex = 0;
                updateUI();
                hideLoading();

            } catch (err) {
                console.error(err);
                alert('讀取 ZIP 檔案時發生錯誤：' + err.message);
                hideLoading();
            }
            
            // 清空 input 讓同個檔案可以重新觸發 change
            zipInput.value = '';
        });

        // 更新 UI (切換圖片時呼叫)
        function updateUI() {
            if (currentIndex < 0 || currentIndex >= imageItems.length) return;

            const item = imageItems[currentIndex];

            // 1. 更新右側當前圖片顯示
            currentImg.src = item.url;
            currentImg.classList.remove('hidden');
            imgPlaceholder.classList.add('hidden');
            
            currentFilename.textContent = item.filename;
            currentCoords.textContent = `原始檔名: X=${item.fileX}, Y=${item.fileY} | 畫布位置: X=${item.x}, Y=${item.y}`;
            progressText.textContent = `${currentIndex + 1} / ${imageItems.length}`;

            // 顯示目前分類狀態標籤
            if (item.category) {
                const catInfo = CATEGORIES[getCategoryKeyByName(item.category)];
                statusBadge.textContent = item.category;
                statusBadge.style.backgroundColor = catInfo.color;
                statusBadge.classList.remove('hidden');
            } else {
                statusBadge.classList.add('hidden');
            }

            // 2. 處理拼圖 Canvas (若 baseName 改變才需要重繪底圖)
            if (currentActiveBase !== item.baseName) {
                drawBaseCanvas(item.baseName);
                currentActiveBase = item.baseName;
                currentBaseNameLabel.textContent = `拼圖群組: ${item.baseName}`;
            }

            // 3. 繪製綠色提示框並自動捲動對焦
            drawOverlayHighlight(item.x, item.y);
            
            // 自動捲動預覽區讓綠框置中顯示
            scrollCanvasTo(item.x, item.y);
        }

        // 繪製底圖 (僅在切換不同前綴檔名時執行)
        function drawBaseCanvas(baseName) {
            const group = baseGroups[baseName];
            if (!group) return;

            // 設定 Canvas 尺寸 (最大座標 + 16 px 寬高)
            const width = group.maxX + 16;
            const height = group.maxY + 16;

            canvasBase.width = width;
            canvasBase.height = height;
            canvasOverlay.width = width;
            canvasOverlay.height = height;

            // 清空並繪製底色
            ctxBase.fillStyle = '#000000'; // 黑色底
            ctxBase.fillRect(0, 0, width, height);

            // 繪製該群組的所有圖片
            group.items.forEach(item => {
                if (item.imgElement) {
                    ctxBase.drawImage(item.imgElement, item.x, item.y, 16, 16);
                }
            });
        }

        // 繪製提示綠框
        function drawOverlayHighlight(x, y) {
            // 清空前一次的框框
            ctxOverlay.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
            
            // 繪製 16x16 的半透明綠色疊加區與粗綠色邊框
            ctxOverlay.fillStyle = 'rgba(34, 197, 94, 0.4)'; // Tailwind green-500 透明
            ctxOverlay.fillRect(x, y, 16, 16);
            
            ctxOverlay.strokeStyle = '#22c55e'; // Tailwind green-500
            ctxOverlay.lineWidth = 3;
            ctxOverlay.strokeRect(x, y, 16, 16);

            // 如果有已經分類過的，畫個小標記上去
            baseGroups[currentActiveBase].items.forEach(item => {
                if (item.category && (item.x !== x || item.y !== y)) {
                    ctxOverlay.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctxOverlay.fillRect(item.x, item.y, 16, 16);
                    ctxOverlay.fillStyle = CATEGORIES[getCategoryKeyByName(item.category)].color;
                    ctxOverlay.beginPath();
                    ctxOverlay.arc(item.x + 32, item.y + 32, 10, 0, Math.PI * 2);
                    ctxOverlay.fill();
                }
            });
        }

        // 自動捲動 Canvas 區塊將目標置中
        function scrollCanvasTo(x, y) {
            const containerWidth = canvasWrapper.clientWidth;
            const containerHeight = canvasWrapper.clientHeight;
            
            const targetScrollLeft = x - (containerWidth / 2) + 32; // +32 是 16 寬的一半
            const targetScrollTop = y - (containerHeight / 2) + 32;

            canvasWrapper.scrollTo({
                left: targetScrollLeft,
                top: targetScrollTop,
                behavior: 'smooth'
            });
        }

        // 從名稱反查按鍵 Key (例如用 'Gravel' 找 '1')
        function getCategoryKeyByName(name) {
            return Object.keys(CATEGORIES).find(key => CATEGORIES[key].name === name);
        }

        // 鍵盤事件監聽 (1, 2, 3, Q)
        window.addEventListener('keydown', function(e) {
            // 確保有載入圖片且沒有被 loading 擋住
            if (imageItems.length === 0 || !loadingOverlay.classList.contains('hidden')) return;

            const key = e.key.toLowerCase();

            // 分類按鍵
            if (CATEGORIES[key]) {
                // 記錄分類
                imageItems[currentIndex].category = CATEGORIES[key].name;
                
                // 跳到下一張
                if (currentIndex < imageItems.length - 1) {
                    currentIndex++;
                    updateUI();
                } else {
                    updateUI();
                    // 已是最後一張
                    setTimeout(() => {
                        if (confirm('已經是最後一張了！是否立即匯出結果？')) {
                            exportResults();
                        }
                    }, 100);
                }
            } 
            // 復原 (返回上一張)
            else if (key === 'q') {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateUI();
                }
            }
        });

        // 匯出功能
        exportBtn.addEventListener('click', exportResults);

        async function exportResults() {
            if (imageItems.length === 0) return;

            showLoading('正在建立匯出檔案 (這會包含您所有已分類及未分類的進度)...');

            try {
                const newZip = new JSZip();
                
                // 建立資料夾
                const folderGravel = newZip.folder('Gravel');
                const folderCoarse = newZip.folder('Coarse_Sand');
                const folderFine = newZip.folder('Fine_Sand');
                const folderUncategorized = newZip.folder('Uncategorized'); // 尚未分類的保留區

                // 將圖片放進對應資料夾
                for (const item of imageItems) {
                    if (item.category === 'Gravel') {
                        folderGravel.file(item.filename, item.blob);
                    } else if (item.category === 'Coarse_Sand') {
                        folderCoarse.file(item.filename, item.blob);
                    } else if (item.category === 'Fine_Sand') {
                        folderFine.file(item.filename, item.blob);
                    } else {
                        folderUncategorized.file(item.filename, item.blob);
                    }
                }

                // 產生 ZIP Blob
                const content = await newZip.generateAsync({ type: 'blob' });
                
                // 使用 FileSaver 觸發下載
                saveAs(content, 'Classified_Images.zip');
                hideLoading();

            } catch (err) {
                console.error(err);
                alert('匯出時發生錯誤：' + err.message);
                hideLoading();
            }
        }

        // Loading UI 切換
        function showLoading(msg) {
            loadingText.textContent = msg;
            loadingOverlay.classList.remove('hidden');
        }

        function hideLoading() {
            loadingOverlay.classList.add('hidden');
        }

    </script>
</body>
</html>
