<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片快速分類工具</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 JSZip 用於處理 ZIP 壓縮檔 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        /* 隱藏捲軸但保持可捲動 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- 頂部導覽列 -->
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold text-slate-700 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
            圖片快速分類工具
        </h1>
        <div id="status-text" class="text-sm font-medium text-slate-500">等待上傳 ZIP 檔案...</div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        
        <!-- 步驟一：上傳畫面 -->
        <div id="upload-view" class="absolute inset-0 flex items-center justify-center bg-slate-100 z-20 transition-opacity duration-300">
            <div class="bg-white p-10 rounded-2xl shadow-lg max-w-md w-full text-center border border-slate-200">
                <div class="mb-6 flex justify-center text-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                </div>
                <h2 class="text-2xl font-bold mb-2">上傳圖片 ZIP 檔</h2>
                <p class="text-slate-500 text-sm mb-8">請選擇包含大量圖片的 ZIP 壓縮檔，系統將自動解析並準備進行分類。</p>
                
                <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors shadow-md inline-flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                    選擇 ZIP 檔案
                    <input type="file" id="zip-input" accept=".zip" class="hidden">
                </label>
                <div id="loading-msg" class="mt-4 text-sm text-blue-600 font-medium hidden">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-600 inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    正在解析壓縮檔，請稍候...
                </div>
            </div>
        </div>

        <!-- 步驟二：分類畫面 -->
        <div id="workspace-view" class="flex-1 flex flex-col hidden h-full p-6 gap-4">
            
            <!-- 上方進度條與操作 -->
            <div class="flex justify-between items-end bg-white p-4 rounded-xl shadow-sm border border-slate-200 shrink-0">
                <div class="flex-1 mr-6">
                    <div class="flex justify-between text-sm font-medium mb-1">
                        <span class="text-slate-600" id="progress-text">進度: 0 / 0</span>
                        <span class="text-blue-600" id="current-filename">filename.jpg</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <button id="btn-export" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg font-medium shadow-md transition flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    匯出 ZIP
                </button>
            </div>

            <!-- 中間圖片展示區 -->
            <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex items-center justify-center p-4 min-h-[50vh] relative">
                <!-- 提示文字 (目前已分類) -->
                <div id="classified-badge" class="absolute top-4 left-4 bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-sm font-bold border border-emerald-200 hidden">
                    已標記為: <span id="classified-label"></span>
                </div>

                <div id="img-loader" class="absolute hidden">
                    <svg class="animate-spin h-10 w-10 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>
                
                <img id="main-image" src="" alt="待分類圖片" class="max-w-full max-h-full object-contain rounded drop-shadow-md hidden">
                
                <div id="end-message" class="text-center hidden">
                    <div class="text-6xl mb-4">🎉</div>
                    <h3 class="text-2xl font-bold text-slate-800 mb-2">分類完成！</h3>
                    <p class="text-slate-500">您已處理完所有的圖片，可以點擊右上角的「匯出 ZIP」來儲存結果。</p>
                </div>
            </div>

            <!-- 下方按鈕區 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 shrink-0">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <button onclick="handleClassification('Gravel')" class="classify-btn flex flex-col items-center justify-center py-3 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-lg transition-all group">
                        <div class="text-xs text-slate-400 mb-1 group-hover:text-blue-500 font-bold">按鍵 1</div>
                        <div class="text-lg font-bold text-slate-700">Gravel</div>
                        <div class="text-xs text-slate-500">(礫石)</div>
                    </button>
                    <button onclick="handleClassification('Coarse_Sand')" class="classify-btn flex flex-col items-center justify-center py-3 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-lg transition-all group">
                        <div class="text-xs text-slate-400 mb-1 group-hover:text-blue-500 font-bold">按鍵 2</div>
                        <div class="text-lg font-bold text-slate-700">Coarse_Sand</div>
                        <div class="text-xs text-slate-500">(粗砂)</div>
                    </button>
                    <button onclick="handleClassification('Fine_Sand')" class="classify-btn flex flex-col items-center justify-center py-3 bg-slate-50 hover:bg-blue-50 border-2 border-slate-200 hover:border-blue-400 rounded-lg transition-all group">
                        <div class="text-xs text-slate-400 mb-1 group-hover:text-blue-500 font-bold">按鍵 3</div>
                        <div class="text-lg font-bold text-slate-700">Fine_Sand</div>
                        <div class="text-xs text-slate-500">(細砂)</div>
                    </button>
                    <button onclick="undo()" class="flex flex-col items-center justify-center py-3 bg-slate-100 hover:bg-slate-200 border-2 border-slate-200 rounded-lg transition-all group">
                        <div class="text-xs text-slate-400 mb-1 group-hover:text-slate-600 font-bold">按鍵 Q</div>
                        <div class="text-lg font-bold text-slate-700 flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
                            返回上一個
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 處理中遮罩 (匯出時) -->
    <div id="processing-overlay" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center hidden flex-col">
        <div class="bg-white p-8 rounded-2xl shadow-xl flex flex-col items-center">
            <svg class="animate-spin h-12 w-12 text-green-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <h3 class="text-xl font-bold text-slate-800">正在打包匯出檔案...</h3>
            <p class="text-slate-500 text-sm mt-2">請勿關閉視窗</p>
        </div>
    </div>

    <script>
        // === 應用程式狀態 ===
        let imageFiles = [];       // 存放所有圖片檔的 JSZip 物件資訊
        let currentIndex = 0;      // 目前顯示的圖片索引
        let classifications = [];  // 分類結果陣列，索引對應 imageFiles
        let currentObjectUrl = null; // 避免記憶體洩漏
        let isProcessing = false;  // 防止按鍵連擊導致出錯

        // === DOM 元素 ===
        const uploadInput = document.getElementById('zip-input');
        const uploadView = document.getElementById('upload-view');
        const workspaceView = document.getElementById('workspace-view');
        const loadingMsg = document.getElementById('loading-msg');
        
        const mainImage = document.getElementById('main-image');
        const imgLoader = document.getElementById('img-loader');
        const endMessage = document.getElementById('end-message');
        const classifiedBadge = document.getElementById('classified-badge');
        const classifiedLabel = document.getElementById('classified-label');
        
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const currentFilename = document.getElementById('current-filename');
        const statusText = document.getElementById('status-text');
        const btnExport = document.getElementById('btn-export');
        const processingOverlay = document.getElementById('processing-overlay');

        // === 支援的圖片格式正規表示式 ===
        const imageRegex = /\.(png|jpe?g|gif|webp|bmp)$/i;

        // === 事件監聽 ===
        uploadInput.addEventListener('change', handleFileUpload);
        document.addEventListener('keydown', handleGlobalKeydown);
        btnExport.addEventListener('click', exportResult);

        /**
         * 處理 ZIP 檔案上傳
         */
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            loadingMsg.classList.remove('hidden');
            uploadInput.parentElement.classList.add('opacity-50', 'pointer-events-none');

            try {
                const zip = new JSZip();
                const loadedZip = await zip.loadAsync(file);
                
                imageFiles = [];
                classifications = [];
                currentIndex = 0;

                // 過濾並搜集所有圖片檔案 (排除目錄與無關檔案，如 __MACOSX 隱藏檔)
                loadedZip.forEach((relativePath, zipEntry) => {
                    if (!zipEntry.dir && imageRegex.test(zipEntry.name) && !zipEntry.name.includes('__MACOSX')) {
                        imageFiles.push(zipEntry);
                    }
                });

                if (imageFiles.length === 0) {
                    alert('在此 ZIP 檔案中找不到支援的圖片！');
                    resetUpload();
                    return;
                }

                // 準備進入工作區
                classifications = new Array(imageFiles.length).fill(null);
                
                uploadView.classList.add('hidden');
                workspaceView.classList.remove('hidden');
                statusText.textContent = `已載入 ${imageFiles.length} 張圖片`;
                
                renderCurrentImage();

            } catch (err) {
                console.error(err);
                alert('讀取 ZIP 檔案失敗：' + err.message);
                resetUpload();
            }
        }

        /**
         * 顯示目前的圖片
         */
        async function renderCurrentImage() {
            if (currentIndex >= imageFiles.length) {
                // 分類完成
                mainImage.classList.add('hidden');
                endMessage.classList.remove('hidden');
                classifiedBadge.classList.add('hidden');
                currentFilename.textContent = "完成！";
                updateProgress();
                return;
            }

            isProcessing = true;
            mainImage.classList.add('hidden');
            endMessage.classList.add('hidden');
            imgLoader.classList.remove('hidden');

            const entry = imageFiles[currentIndex];
            currentFilename.textContent = entry.name.split('/').pop(); // 只顯示檔名不顯示路徑

            try {
                // 從 ZIP 中提取 Blob
                const blob = await entry.async("blob");
                
                // 清除舊的 ObjectURL 避免 Memory Leak
                if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                }
                
                currentObjectUrl = URL.createObjectURL(blob);
                
                // 圖片載入完成後再顯示
                mainImage.onload = () => {
                    imgLoader.classList.add('hidden');
                    mainImage.classList.remove('hidden');
                    isProcessing = false;
                };
                mainImage.src = currentObjectUrl;

                // 檢查是否已經有分類過 (當我們按 Q 返回時)
                const existingClass = classifications[currentIndex];
                if (existingClass) {
                    classifiedLabel.textContent = existingClass;
                    classifiedBadge.classList.remove('hidden');
                } else {
                    classifiedBadge.classList.add('hidden');
                }

                updateProgress();

            } catch (err) {
                console.error("圖片載入失敗", err);
                alert("圖片載入失敗，跳至下一張");
                currentIndex++;
                renderCurrentImage();
            }
        }

        /**
         * 更新進度條與文字
         */
        function updateProgress() {
            let processedCount = classifications.filter(c => c !== null).length;
            let total = imageFiles.length;
            
            // 顯示目前進度 (例如: 第 5 張 / 共 10 張) 
            // 若到底了，就顯示 "完成總數 / 總數"
            let displayIndex = Math.min(currentIndex + 1, total);
            if (currentIndex >= total) displayIndex = total;

            progressText.textContent = `圖片: ${displayIndex} / ${total} (已分類: ${processedCount})`;
            
            let percent = (processedCount / total) * 100;
            progressBar.style.width = `${percent}%`;

            // 如果有分類過，就允許匯出（即使只有一張）
            btnExport.disabled = processedCount === 0;
        }

        /**
         * 處理分類動作
         */
        function handleClassification(categoryName) {
            if (isProcessing || currentIndex >= imageFiles.length) return;

            // 記錄分類結果
            classifications[currentIndex] = categoryName;
            
            // 前進下一張
            currentIndex++;
            renderCurrentImage();
        }

        /**
         * 處理返回動作 (Undo)
         */
        function undo() {
            if (isProcessing) return;
            if (currentIndex > 0) {
                currentIndex--;
                renderCurrentImage();
            }
        }

        /**
         * 鍵盤事件對應
         */
        function handleGlobalKeydown(e) {
            // 如果畫面還沒進入工作區，就不處理鍵盤事件
            if (workspaceView.classList.contains('hidden')) return;
            
            const key = e.key.toLowerCase();
            
            if (key === '1') {
                handleClassification('Gravel');
            } else if (key === '2') {
                handleClassification('Coarse_Sand');
            } else if (key === '3') {
                handleClassification('Fine_Sand');
            } else if (key === 'q') {
                undo();
            }
        }

        /**
         * 匯出分類結果 ZIP
         */
        async function exportResult() {
            if (classifications.filter(c => c !== null).length === 0) {
                alert("目前還沒有分類任何圖片。");
                return;
            }

            processingOverlay.classList.remove('hidden');

            try {
                const outZip = new JSZip();
                
                // 建立要求的三個資料夾
                const folders = {
                    'Gravel': outZip.folder('Gravel'),
                    'Coarse_Sand': outZip.folder('Coarse_Sand'),
                    'Fine_Sand': outZip.folder('Fine_Sand')
                };

                let exportCount = 0;

                // 處理所有有被分類的圖片
                for (let i = 0; i < imageFiles.length; i++) {
                    const category = classifications[i];
                    if (category && folders[category]) {
                        const entry = imageFiles[i];
                        // 取得原本檔案的位元資料
                        const data = await entry.async("uint8array");
                        
                        // 取得原始檔名 (忽略原先路徑)
                        const originalFilename = entry.name.split('/').pop();
                        
                        // 將檔案放入對應資料夾
                        folders[category].file(originalFilename, data);
                        exportCount++;
                    }
                }

                // 產生新的 ZIP
                const content = await outZip.generateAsync({
                    type: "blob",
                    compression: "STORE" // 圖片已壓縮，直接 STORE 較快
                });

                // 下載檔案
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = `Classified_Images_${exportCount}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                setTimeout(() => {
                    alert(`成功匯出 ${exportCount} 張分類圖片！`);
                }, 500);

            } catch (err) {
                console.error(err);
                alert("打包匯出時發生錯誤：" + err.message);
            } finally {
                processingOverlay.classList.add('hidden');
            }
        }

        /**
         * 重設上傳區狀態
         */
        function resetUpload() {
            loadingMsg.classList.add('hidden');
            uploadInput.parentElement.classList.remove('opacity-50', 'pointer-events-none');
            uploadInput.value = ''; // 清除輸入
        }

    </script>
</body>
</html>
