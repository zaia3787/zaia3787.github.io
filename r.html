<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沉積物顆粒標註工具</title>
    <style>
        /* 學術簡約風格 */
        body {
            font-family: "Times New Roman", Times, serif;
            color: #000;
            background-color: #fff;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 1.5rem;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            margin-top: 0;
        }

        .layout-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 上方區域容器 */
        .top-section {
            display: flex;
            flex-direction: column;
        }

        /* 畫布上方工具列 */
        .canvas-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f0f0f0;
            border: 1px solid #000;
            border-bottom: none;
            padding: 8px 15px;
            font-size: 0.95rem;
        }
        
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .canvas-toolbar input[type="range"] {
            cursor: pointer;
        }

        .tool-btn {
            background-color: #fff;
            border: 1px solid #999;
            padding: 4px 10px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 3px;
        }

        .tool-btn:hover {
            background-color: #ddd;
        }

        .tool-btn.active {
            background-color: #ccc;
            font-weight: bold;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .divider {
            color: #999;
            margin: 0 5px;
        }

        /* 扁長形圖片預覽與畫布 */
        .top-panel {
            width: 100%;
            border: 1px solid #000;
            background-color: #eee;
            overflow: auto; /* 允許圖片捲動 */
            max-height: 60vh; /* 限制最高佔螢幕 60% */
            position: relative;
        }

        canvas {
            display: block;
            cursor: crosshair;
            transform-origin: top left;
        }

        /* 下方區域：左控制、右分析 */
        .bottom-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .control-panel, .stats-panel {
            border: 1px solid #000;
            padding: 15px;
            background-color: #fafafa;
        }

        .form-group {
            margin-bottom: 15px;
        }

        fieldset {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 15px;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .color-box {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin-left: 5px;
            border: 1px solid #000;
        }

        .combo-legend {
            margin-top: 10px;
            font-size: 0.85rem;
            background-color: #fff;
            padding: 8px;
            border: 1px dashed #999;
        }

        .combo-legend-item {
            display: inline-flex;
            align-items: center;
            margin-right: 10px;
            margin-bottom: 5px;
        }

        button.action-btn {
            font-family: inherit;
            font-weight: bold;
            border: 1px solid #000;
            background-color: #fff;
            padding: 8px 12px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        button.action-btn:hover {
            background-color: #ddd;
        }

        button.primary {
            background-color: #e6f7ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: right;
        }

        th {
            background-color: #f0f0f0;
            text-align: center;
        }

        .info-text {
            font-size: 0.85rem;
            color: #555;
            margin-top: 5px;
        }

    </style>
</head>
<body>

    <h1>沉積物顆粒面積標註系統</h1>

    <div class="layout-wrapper">
        <!-- 上方預覽與繪製區域 -->
        <div class="top-section">
            <!-- 視角與不透明度調整工具列 -->
            <div class="canvas-toolbar">
                <div class="toolbar-group">
                    <button id="btnPanMode" class="tool-btn">✋ 移動</button>
                    <button id="btnDrawMode" class="tool-btn active">✏️ 標註</button>
                    <span class="divider">|</span>
                    <button id="btnZoomOut" class="tool-btn">➖ 縮小</button>
                    <span id="zoomDisplay" style="display:inline-block; width: 45px; text-align:center;">100%</span>
                    <button id="btnZoomIn" class="tool-btn">➕ 放大</button>
                    <button id="btnZoomReset" class="tool-btn">重置視角</button>
                </div>
                <div class="toolbar-group">
                    <label for="opacitySlider"><strong>標籤不透明度:</strong></label>
                    <input type="range" id="opacitySlider" min="0" max="40" value="40">
                    <span id="opacityValue" style="min-width: 35px; text-align: right;">40%</span>
                </div>
            </div>
            <div class="top-panel" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>

        <!-- 下方分析與控制區域 -->
        <div class="bottom-panel">
            
            <!-- 左側：工具控制 -->
            <div class="control-panel">
                <div class="form-group">
                    <label for="imageLoader"><strong>1. 載入影像:</strong></label>
                    <input type="file" id="imageLoader" accept="image/*">
                </div>

                <fieldset>
                    <legend>2. 選擇標籤組合</legend>
                    <div class="info-text" style="margin-bottom:10px;">
                        * 畫布實體重疊優先權：粗礪 > 粗砂 > 細砂泥 。
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="cb-gravel" checked> 粗礪 (Gravel) 
                        </label>
                        <label>
                            <input type="checkbox" id="cb-coarse"> 粗砂 (Coarse Sand)
                        </label>
                        <label>
                            <input type="checkbox" id="cb-fine"> 細砂泥 (Fine Sand)
                        </label>
                    </div>

                    <!-- 顯示各種組合的顏色對應 -->
                    <div class="combo-legend">
                        <div style="margin-bottom: 5px; font-weight: bold;">目前勾選組合之預期顏色：</div>
                        <div class="combo-legend-item">
                            粗礪 <span class="color-box" style="background-color: rgb(255, 0, 0);"></span>
                        </div>
                        <div class="combo-legend-item">
                            粗砂 <span class="color-box" style="background-color: rgb(0, 255, 0);"></span>
                        </div>
                        <div class="combo-legend-item">
                            細砂泥 <span class="color-box" style="background-color: rgb(0, 0, 255);"></span>
                        </div><br>
                        <div class="combo-legend-item">
                            粗礪+粗砂 <span class="color-box" style="background-color: rgb(255, 255, 0);"></span>
                        </div>
                        <div class="combo-legend-item">
                            粗礪+細砂泥 <span class="color-box" style="background-color: rgb(255, 0, 255);"></span>
                        </div>
                        <div class="combo-legend-item">
                            粗砂+細砂泥 <span class="color-box" style="background-color: rgb(0, 255, 255);"></span>
                        </div>
                        <div class="combo-legend-item">
                            三者全選 <span class="color-box" style="background-color: rgb(200, 200, 200);"></span>
                        </div>
                    </div>
                </fieldset>

                <div>
                    <button id="undoBtn" class="action-btn">復原上一步</button>
                    <button id="clearBtn" class="action-btn">清除所有標註</button>
                    <button id="downloadBtn" class="action-btn primary">下載面積圖</button>
                </div>
            </div>

            <!-- 右側：數據統計 -->
            <div class="stats-panel">
                <h3 style="margin-top: 0;">面積統計</h3>
                <div class="info-text" style="margin-bottom: 10px;">
                    ※ 包含兩種之標籤面積計算以顆粒直徑最小沉積物計算 。
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>類別</th>
                            <th>面積 (px²)</th>
                            <th>佔標註總和 (%)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="text-align: left;">粗礪 (Gravel)</td>
                            <td id="area-gravel">0</td>
                            <td id="pct-gravel">0.00%</td>
                        </tr>
                        <tr>
                            <td style="text-align: left;">粗砂 (Coarse Sand)</td>
                            <td id="area-coarse">0</td>
                            <td id="pct-coarse">0.00%</td>
                        </tr>
                        <tr>
                            <td style="text-align: left;">細砂泥 (Fine Sand)</td>
                            <td id="area-fine">0</td>
                            <td id="pct-fine">0.00%</td>
                        </tr>
                        <tr style="font-weight: bold; background-color: #f9f9f9;">
                            <td style="text-align: left;">有效標註總面積</td>
                            <td id="area-total">0</td>
                            <td>100%</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const container = document.getElementById('canvasContainer');
        
        // UI 元素
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');
        
        // 工具列按鈕
        const btnPanMode = document.getElementById('btnPanMode');
        const btnDrawMode = document.getElementById('btnDrawMode');
        const btnZoomIn = document.getElementById('btnZoomIn');
        const btnZoomOut = document.getElementById('btnZoomOut');
        const btnZoomReset = document.getElementById('btnZoomReset');
        const zoomDisplay = document.getElementById('zoomDisplay');

        // 設定出血區大小 (畫布比圖片多出的邊界)
        const BLEED = 100;
        
        // 使用離線畫布 進行差集、融合與面積計算 (已移除不需要的 borderLayer)
        const fillLayerCanvas = document.createElement('canvas');
        const fillCtx = fillLayerCanvas.getContext('2d');
        const calcCanvas = document.createElement('canvas');
        const calcCtx = calcCanvas.getContext('2d', { willReadFrequently: true });

        let img = new Image();
        let polygons = []; // 儲存所有的標註形狀
        let currentPolygon = []; // 正在繪製的形狀
        let isDrawing = false;
        
        // 視角與操作狀態
        let currentZoom = 1.0;
        let isPanMode = false;
        let isDraggingPan = false;
        let startPanX = 0, startPanY = 0;
        let startScrollLeft = 0, startScrollTop = 0;

        // 載入影像
        imageLoader.addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                img.onload = function() {
                    // 同步所有畫布內部尺寸，加上出血區
                    const w = img.width + BLEED * 2;
                    const h = img.height + BLEED * 2;
                    
                    mainCanvas.width = w; mainCanvas.height = h;
                    fillLayerCanvas.width = w; fillLayerCanvas.height = h;
                    calcCanvas.width = w; calcCanvas.height = h;
                    
                    polygons = [];
                    currentZoom = 1.0;
                    updateZoomDisplay();
                    redrawCanvas();
                    updateStatistics();
                }
                img.src = event.target.result;
            }
            if(e.target.files[0]){
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        // ======= 視角控制邏輯 =======
        function updateZoomDisplay() {
            // 利用 CSS 寬高控制視覺縮放，不影響內部座標系統
            mainCanvas.style.width = (mainCanvas.width * currentZoom) + 'px';
            mainCanvas.style.height = (mainCanvas.height * currentZoom) + 'px';
            zoomDisplay.innerText = Math.round(currentZoom * 100) + '%';
        }

        btnZoomIn.onclick = () => { if (img.src) { currentZoom *= 1.2; updateZoomDisplay(); } };
        btnZoomOut.onclick = () => { if (img.src) { currentZoom /= 1.2; updateZoomDisplay(); } };
        btnZoomReset.onclick = () => { if (img.src) { currentZoom = 1.0; updateZoomDisplay(); } };

        function setMode(mode) {
            isPanMode = (mode === 'pan');
            if (isPanMode) {
                btnPanMode.classList.add('active');
                btnDrawMode.classList.remove('active');
                mainCanvas.style.cursor = 'grab';
            } else {
                btnPanMode.classList.remove('active');
                btnDrawMode.classList.add('active');
                mainCanvas.style.cursor = 'crosshair';
            }
        }

        btnPanMode.onclick = () => setMode('pan');
        btnDrawMode.onclick = () => setMode('draw');

        // ======= 快捷鍵控制 (空白鍵臨時平移) =======
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && img.src && e.target !== opacitySlider) {
                e.preventDefault(); // 防止空白鍵導致網頁捲動
                if (!isDraggingPan && !isDrawing) {
                    mainCanvas.style.cursor = 'grab';
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space' && !isPanMode && !isDraggingPan) {
                mainCanvas.style.cursor = 'crosshair';
            }
        });

        // 監聽不透明度滑桿變化
        opacitySlider.addEventListener('input', function() {
            opacityValue.innerText = this.value + '%';
            redrawCanvas(); // 數值改變時即時重繪畫布
        });

        // 解析當前勾選狀態
        function getActiveCategory() {
            const hasG = document.getElementById('cb-gravel').checked;
            const hasC = document.getElementById('cb-coarse').checked;
            const hasF = document.getElementById('cb-fine').checked;

            if (!hasG && !hasC && !hasF) return null;

            let tally = 'G';
            if (hasF) tally = 'F';
            else if (hasC) tally = 'C';
            else if (hasG) tally = 'G';

            let prio = 1; 
            if (tally === 'F') prio = 1;
            if (tally === 'C') prio = 2;
            if (tally === 'G') prio = 3;

            let r=0, g=0, b=0;
            if (hasG && !hasC && !hasF) { r=255; g=0; b=0; }      
            else if (!hasG && hasC && !hasF) { r=0; g=255; b=0; } 
            else if (!hasG && !hasC && hasF) { r=0; g=0; b=255; } 
            else if (hasG && hasC && !hasF) { r=255; g=255; b=0; } 
            else if (hasG && !hasC && hasF) { r=255; g=0; b=255; } 
            else if (!hasG && hasC && hasF) { r=0; g=255; b=255; } 
            else if (hasG && hasC && hasF) { r=200; g=200; b=200; } 

            return { r, g, b, tally, prio };
        }

        // ======= 滑鼠事件 (統整繪圖與平移) =======
        mainCanvas.addEventListener('mousedown', function(e) {
            if (!img.src) return;

            // 觸發移動模式：當前是平移模式，或是按下了滑鼠中鍵(button 1)，或是按著空白鍵
            if (isPanMode || e.button === 1 || e.getModifierState("Space")) {
                isDraggingPan = true;
                startPanX = e.clientX;
                startPanY = e.clientY;
                startScrollLeft = container.scrollLeft;
                startScrollTop = container.scrollTop;
                mainCanvas.style.cursor = 'grabbing';
                e.preventDefault(); // 阻擋中鍵原生的網頁捲動
                return;
            }

            // 觸發繪圖模式：左鍵(button 0)
            if (e.button === 0 && !isPanMode) {
                const cat = getActiveCategory();
                if (!cat) {
                    alert('請至少勾選一種標籤組合！');
                    return;
                }
                isDrawing = true;
                currentPolygon = [getMousePos(mainCanvas, e)];
            }
        });

        // 綁定在 window 上避免拖曳過快滑出畫布而失效
        window.addEventListener('mousemove', function(e) {
            if (isDraggingPan) {
                const dx = e.clientX - startPanX;
                const dy = e.clientY - startPanY;
                container.scrollLeft = startScrollLeft - dx;
                container.scrollTop = startScrollTop - dy;
                return;
            }

            if (isDrawing && e.target === mainCanvas) {
                currentPolygon.push(getMousePos(mainCanvas, e));
                redrawCanvas(); // 畫線預覽
            }
        });

        window.addEventListener('mouseup', function(e) {
            if (isDraggingPan) {
                isDraggingPan = false;
                // 恢復游標狀態
                if (e.getModifierState("Space") && !isPanMode) {
                    mainCanvas.style.cursor = 'grab';
                } else {
                    mainCanvas.style.cursor = isPanMode ? 'grab' : 'crosshair';
                }
                return;
            }

            if (isDrawing) {
                isDrawing = false;
                if (currentPolygon.length > 2) {
                    polygons.push({
                        points: currentPolygon,
                        cat: getActiveCategory()
                    });
                }
                currentPolygon = [];
                redrawCanvas();
                updateStatistics();
            }
        });

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            // getBoundingClientRect().width 會反映 CSS zoom 縮放後的大小
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        // 重新繪製畫面 (移除線框，保留純粹色塊與影像範圍內裁切)
        function redrawCanvas() {
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            // 1. 畫出血區背景與底圖
            ctx.fillStyle = '#e6e6e6'; 
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            
            if (img.src) {
                ctx.drawImage(img, BLEED, BLEED);
                
                // 畫出實際圖片範圍的虛線提示
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(BLEED, BLEED, img.width, img.height);
                ctx.setLineDash([]);

                // 設定裁切區域，確保所有標註只顯示在圖片內部
                ctx.save();
                ctx.beginPath();
                ctx.rect(BLEED, BLEED, img.width, img.height);
                ctx.clip();
            }

            // 2. 處理填色圖層
            fillCtx.clearRect(0, 0, fillLayerCanvas.width, fillLayerCanvas.height);

            const tracePoly = (targetCtx, pts) => {
                if (pts.length < 3) return;
                targetCtx.beginPath();
                targetCtx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    targetCtx.lineTo(pts[i].x, pts[i].y);
                }
                targetCtx.closePath();
            };

            // 將多邊形依據「顏色」分組，達成同色完美融合 (Union/OR)
            const groups = {};
            polygons.forEach(poly => {
                const key = `${poly.cat.r},${poly.cat.g},${poly.cat.b}`;
                if (!groups[key]) groups[key] = { cat: poly.cat, polys: [] };
                groups[key].polys.push(poly);
            });
            
            // 依優先權排序群組 (低 -> 高)
            const sortedGroups = Object.values(groups).sort((a, b) => a.cat.prio - b.cat.prio);

            sortedGroups.forEach(group => {
                // 處理填色 (Fill Layer)：無需再處理邊框，畫面更簡潔
                fillCtx.globalCompositeOperation = 'source-over';
                fillCtx.fillStyle = `rgb(${group.cat.r}, ${group.cat.g}, ${group.cat.b})`;
                group.polys.forEach(poly => {
                    tracePoly(fillCtx, poly.points);
                    fillCtx.fill('nonzero');
                });
            });

            // 將處理好的填色層疊加上去 (讀取滑桿設定的數值)
            const currentOpacity = parseFloat(opacitySlider.value) / 100;
            ctx.globalAlpha = currentOpacity;
            ctx.drawImage(fillLayerCanvas, 0, 0);
            
            ctx.globalAlpha = 1.0; 

            // 3. 繪製套索工具「正在拖拉」時的虛線預覽 (方便標註時辨識，畫完即消失)
            if (isDrawing && currentPolygon.length > 0) {
                const cat = getActiveCategory();
                tracePoly(ctx, currentPolygon);
                
                // 預覽透明度設為當前設定值的一半
                const previewOpacity = currentOpacity * 0.5;
                ctx.fillStyle = `rgba(${cat.r}, ${cat.g}, ${cat.b}, ${previewOpacity})`;
                ctx.fill();

                ctx.strokeStyle = `rgb(${cat.r}, ${cat.g}, ${cat.b})`;
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]); 
                ctx.stroke();
                ctx.setLineDash([]); 
            }

            if (img.src) {
                // 還原裁切設定
                ctx.restore();
            }
        }

        // 使用像素運算法來計算精確面積 (自動處理交集與差集，且排除出血區)
        function updateStatistics() {
            if (polygons.length === 0) {
                renderStats(0, 0, 0);
                return;
            }

            calcCtx.clearRect(0, 0, calcCanvas.width, calcCanvas.height);
            const sortedPolygons = [...polygons].sort((a, b) => a.cat.prio - b.cat.prio);

            sortedPolygons.forEach(poly => {
                calcCtx.beginPath();
                calcCtx.moveTo(poly.points[0].x, poly.points[0].y);
                for (let i = 1; i < poly.points.length; i++) {
                    calcCtx.lineTo(poly.points[i].x, poly.points[i].y);
                }
                calcCtx.closePath();

                if (poly.cat.tally === 'G') calcCtx.fillStyle = 'rgba(255, 0, 0, 255)';
                else if (poly.cat.tally === 'C') calcCtx.fillStyle = 'rgba(0, 255, 0, 255)';
                else if (poly.cat.tally === 'F') calcCtx.fillStyle = 'rgba(0, 0, 255, 255)';
                
                calcCtx.fill();
            });

            // 僅提取「實際圖片範圍」的像素，無視出血區
            if (img.src) {
                const imgData = calcCtx.getImageData(BLEED, BLEED, img.width, img.height).data;
                let areaG = 0, areaC = 0, areaF = 0;

                for (let i = 0; i < imgData.length; i += 4) {
                    if (imgData[i+3] === 0) continue; 

                    if (imgData[i] > 128) areaG++;       
                    else if (imgData[i+1] > 128) areaC++;
                    else if (imgData[i+2] > 128) areaF++;
                }

                renderStats(areaG, areaC, areaF);
            }
        }

        function renderStats(g, c, f) {
            const total = g + c + f;
            document.getElementById('area-gravel').innerText = g.toLocaleString();
            document.getElementById('area-coarse').innerText = c.toLocaleString();
            document.getElementById('area-fine').innerText = f.toLocaleString();
            document.getElementById('area-total').innerText = total.toLocaleString();

            const formatPct = (val) => total === 0 ? "0.00%" : ((val / total) * 100).toFixed(2) + "%";
            document.getElementById('pct-gravel').innerText = formatPct(g);
            document.getElementById('pct-coarse').innerText = formatPct(c);
            document.getElementById('pct-fine').innerText = formatPct(f);
        }

        document.getElementById('undoBtn').addEventListener('click', () => {
            polygons.pop();
            redrawCanvas();
            updateStatistics();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if(confirm('確定要清除所有標註嗎？')) {
                polygons = [];
                redrawCanvas();
                updateStatistics();
            }
        });

        // 下載圖片 (自動裁切掉出血區)
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (!img.src) {
                alert('沒有可下載的影像！請先載入影像並標註。');
                return;
            }
            
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = img.width;
            exportCanvas.height = img.height;
            const exportCtx = exportCanvas.getContext('2d');
            
            // 僅將實際圖片範圍 (BLEED, BLEED) 拷貝出來下載
            exportCtx.drawImage(mainCanvas, BLEED, BLEED, img.width, img.height, 0, 0, img.width, img.height);
            
            const link = document.createElement('a');
            link.download = 'sediment_area_map.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        });

    </script>
</body>
</html>
